[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/dns",
    "crates/lists",
    "crates/classify",
    "crates/devices",
    "crates/apps",
    "crates/panel",
    "crates/service",
    "crates/license",
    "crates/verify",
    "crates/cli",
    "crates/zero",
    "crates/secure",
    "crates/rele",
]

[workspace.package]
version = "1.0.34"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/guardianagroup/guardiana"
homepage = "https://guardianagroup.com"
authors = ["Guardiana"]

# Every dependency is declared once here and justified in a comment.
# Crates only pull what they need with `workspace = true`.
[workspace.dependencies]
# libc: only to reset SIGPIPE to its default on Unix so `guardiana ... | head`
# exits quietly instead of panicking (already a transitive dependency).
libc = "0.2"
guardiana-core = { path = "crates/core" }
guardiana-dns = { path = "crates/dns" }
guardiana-lists = { path = "crates/lists" }
guardiana-classify = { path = "crates/classify" }
guardiana-devices = { path = "crates/devices" }
guardiana-apps = { path = "crates/apps" }
guardiana-panel = { path = "crates/panel" }
guardiana-service = { path = "crates/service" }
guardiana-license = { path = "crates/license" }
guardiana-verify = { path = "crates/verify" }
guardiana-cli = { path = "crates/cli" }
guardiana-zero = { path = "crates/zero" }
guardiana-secure = { path = "crates/secure" }
guardiana-rele = { path = "crates/rele" }

# --- third-party, each justified (brief §2) ---
# --- GUARDIANA ZERO, the browser (decision 197). All four were already in the tree through
# rustls/ureq; the browser's core uses them directly. ---
# url: parse every address the browser asks for (host, scheme, query) the way the engine does.
url = "2"
# idna: turn the Public Suffix List's Unicode rules into the ASCII form hosts arrive in.
idna = "1"
# ring: ECDSA P-256 signatures on the receipts (a mandate, the data book), verifiable in any
# browser with WebCrypto; the same audited crate rustls already uses.
ring = "0.17"
# base64: the receipts' signature and public key, and the base64 forms of marked data.
base64 = "0.23"
# SQLite for the ledger (brief §3). `bundled` compiles SQLite in so every
# install carries the same, known version instead of whatever the OS ships.
rusqlite = { version = "0.40", features = ["bundled"] }
# SHA-256 for the hash chain: row_hash = sha256(prev_hash || fields) (brief §3).
sha2 = "0.11"
# JSON export, `signals_json` column and every on-disk/JSON structure (brief §3, §8).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Async runtime for the resolver and the panel (brief §2).
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util", "signal"] }
# The phone's leg of GUARDIANA SECURE (15 Oct 2026): WebTransport (HTTP/3 over QUIC, TLS 1.3)
# from the phone's browser to this computer, with the certificate pinned by its hash. Pure Rust
# (quinn + rustls with ring); the browser needs nothing installed.
wtransport = { version = "0.7", default-features = false, features = ["self-signed", "ring"] }
# The relay's certificate for the phones (16 Oct 2026, iPhone and iPad): a phone's browser only
# opens wss:// to a publicly signed name. rustls is already in the tree (ureq, wtransport), with
# ring; tokio-rustls is the thin async adapter from the same project.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# DNS server, forwarding resolver with TTL cache, and wire types (brief §2, §4).
hickory-server = { version = "0.26", default-features = false }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }
hickory-proto = { version = "0.26", default-features = false }
# A larger receive buffer on the resolver's UDP sockets, so a burst of queries is not dropped by
# the kernel before it is read (measured 5 Oct 2026: a cold burst of 500 lost 180 to
# RcvbufErrors). Already in the tree via tokio, same version; no unsafe of our own for it.
socket2 = "0.6"
# Required to implement hickory-server's `RequestHandler` trait, which is declared with it.
async-trait = "0.1"
# Local HTTP panel on 127.0.0.1 (brief §2, §8): routing, JSON, query strings. No TLS, no extras.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
# OS randomness for the per-installation panel token (brief §8). Already in the tree via hickory.
getrandom = "0.4"
# Windows service control manager integration (brief §2, §11): install, run, stop.
windows-service = "0.8"
# The only HTTP client, for the connections the user starts (brief §9 licence
# activation, §5 list updates, §12 update check), each recorded in `outbound`.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
# Verifies the minisign signature of the installed binary against the embedded key (brief §10).
minisign-verify = "0.2"
# QR code for the Home Mode page (brief §7). Rendered as SVG text, no image crate.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Olm double ratchet for GUARDIANA SECURE (plan of 14 Oct 2026). Apache-2.0.
# Only guardiana-secure may depend on it. The DNS service must not.
# SessionConfig::version_1 is the Olm that Matrix deploys. Version 2 is experimental
# and is not enabled.
vodozemac = "0.10"
# XChaCha20-Poly1305 for SECURE's files in blocks; already in the tree via vodozemac.
chacha20poly1305 = "0.10"

[workspace.lints.rust]
# Brief §2: `unsafe` is forbidden unless justified in a comment.
# `deny` (not `forbid`) so a justified item can carry `#[allow(unsafe_code)]` next to its comment.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Release binaries: small, stripped, reproducible (brief §10).
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = 3
