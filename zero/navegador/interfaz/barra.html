<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>GUARDIANA ZERO</title>
<link rel="stylesheet" href="comun.css">
<style>
html, body { height: 100%; overflow: hidden; background: var(--marco); user-select: none; }
#pestanas { height: 38px; display: flex; align-items: flex-end; gap: 2px; padding: 0 8px 0 10px; }
.pestana { position: relative; display: flex; align-items: center; gap: 8px; height: 32px; min-width: 64px; max-width: 232px; flex: 1 1 232px; padding: 0 6px 0 12px; border-radius: 10px 10px 0 0; color: var(--gris); cursor: default; }
.pestana:hover { background: color-mix(in srgb, var(--hoja) 55%, transparent); }
.pestana[aria-selected="true"] { background: var(--hoja); color: var(--tinta); box-shadow: 0 -1px 0 var(--linea), 1px 0 0 var(--linea), -1px 0 0 var(--linea); }
.pestana .titulo { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; }
.pestana img.icono { width: 16px; height: 16px; flex: none; border-radius: 3px; }
.pestana .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--gris-suave); flex: none; }
.pestana.cargando .punto { background: none; border: 2px solid var(--azul); border-right-color: transparent; width: 10px; height: 10px; animation: gira .8s linear infinite; }
.pestana.mandato .punto { border-radius: 2px; background: var(--azul); }
.pestana.aislada .punto { background: none; border: 1.5px dashed var(--gris); }
@keyframes gira { to { transform: rotate(360deg); } }
.pestana .cerrar { flex: none; width: 20px; height: 20px; border: 0; border-radius: 6px; background: none; color: var(--gris); display: grid; place-items: center; opacity: 0; }
.pestana:hover .cerrar, .pestana[aria-selected="true"] .cerrar { opacity: 1; }
.pestana .cerrar:hover { background: var(--campo); color: var(--tinta); }
#nueva { width: 30px; height: 30px; margin: 0 0 1px 4px; border: 0; border-radius: 8px; background: none; color: var(--gris); display: grid; place-items: center; }
#nueva:hover { background: color-mix(in srgb, var(--hoja) 60%, transparent); color: var(--tinta); }
.marca { margin-left: auto; align-self: center; display: flex; align-items: center; gap: 7px; font: 600 11.5px/1 var(--display); letter-spacing: .02em; color: var(--gris); padding-left: 16px; white-space: nowrap; }
.marca i { width: 8px; height: 8px; border-radius: 50%; background: var(--azul); box-shadow: 0 0 0 3px var(--azul-suave); }

#herramientas { position: relative; height: 46px; background: var(--hoja); display: flex; align-items: center; gap: 4px; padding: 0 10px; border-bottom: 1px solid var(--linea); }
.icono { width: 34px; height: 34px; border: 0; border-radius: 9px; background: none; color: var(--tinta); display: grid; place-items: center; flex: none; }
.icono:hover:not(:disabled) { background: var(--campo); }
.icono:disabled { color: var(--gris-suave); opacity: .55; cursor: default; }
.icono.activo { background: var(--azul-suave); color: var(--azul); }
.icono svg { width: 18px; height: 18px; }

#direccion { flex: 1; min-width: 120px; height: 34px; margin: 0 6px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 17px; background: var(--campo); border: 1px solid transparent; }
#direccion:focus-within { background: var(--hoja); border-color: var(--azul); box-shadow: 0 0 0 3px var(--azul-suave); }
#candado { flex: none; display: grid; place-items: center; color: var(--verde); }
#candado.abierto { color: var(--ambar); }
#candado.interno { color: var(--azul); }
#candado svg { width: 15px; height: 15px; }
#campo-dir { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 14px; color: var(--tinta); }
#vista-dir { position: absolute; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
#vista-dir b { font-weight: 500; color: var(--tinta); }
#vista-dir span { color: var(--gris); }
#aviso-corte { flex: none; max-width: 42%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12.5px; color: var(--rojo); opacity: 0; transform: translateX(6px); transition: opacity .2s, transform .2s; }
#aviso-corte.visto { opacity: 1; transform: none; }

/* The shield: how many companies were stopped on this page. It is the browser's pulse. */
#b-escudo { height: 34px; padding: 0 12px 0 9px; border: 1px solid var(--linea); border-radius: 17px; background: var(--hoja); display: flex; align-items: center; gap: 7px; color: var(--verde); font-weight: 600; font-variant-numeric: tabular-nums; flex: none; }
#b-escudo:hover { background: var(--verde-suave); }
#b-escudo.mirando { color: var(--ambar); }
#b-escudo.mirando:hover { background: var(--ambar-suave); }
#b-escudo.activo { border-color: currentColor; }
#b-escudo svg { width: 17px; height: 17px; }
#b-escudo.late { animation: late .45s ease-out; }
@keyframes late { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 45%, transparent); } 100% { box-shadow: 0 0 0 8px transparent; } }
#b-escudo-n { min-width: 1ch; }

/* The subscription, when there is something to say: the last two days of the trial, or no protection. */
#b-licencia { height: 30px; padding: 0 12px; border: 1px solid var(--ambar); border-radius: 15px; background: var(--ambar-suave); color: var(--tinta); font-weight: 600; font-size: 12.5px; flex: none; white-space: nowrap; }
#b-licencia.sin-proteccion { border-color: var(--rojo); background: var(--rojo); color: #fff; }
#b-licencia:hover { filter: brightness(1.05); }
/* A mandate's tab: the AI can be stopped from the bar, in one click. */
#b-parar { height: 30px; padding: 0 12px 0 10px; border: 0; border-radius: 15px; background: var(--rojo); color: #fff; font-weight: 600; font-size: 12.5px; display: flex; align-items: center; gap: 7px; flex: none; }
#b-parar i { width: 8px; height: 8px; border-radius: 2px; background: #fff; }
#b-parar:hover { filter: brightness(1.08); }
/* The guard line: the last minute of this tab, one mark per request to another company. */
#guardia { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 3px; display: block; }
#herramientas:hover #guardia { height: 5px; }
</style>
</head>
<body>
<div id="pestanas" role="tablist">
  <button id="nueva" data-t-title="pestana_nueva"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button>
  <span class="marca"><i></i><span data-t="app_nombre"></span></span>
</div>
<div id="herramientas">
  <button class="icono" id="atras" data-t-title="atras" disabled><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l-6 6 6 6"/></svg></button>
  <button class="icono" id="adelante" data-t-title="adelante" disabled><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l6 6-6 6"/></svg></button>
  <button class="icono" id="recargar" data-t-title="recargar"><svg id="ic-recargar" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 10a5.5 5.5 0 1 1-1.6-3.9"/><path d="M14.5 3v3.5H11"/></svg><svg id="ic-detener" class="oculto" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
  <form id="direccion" autocomplete="off">
    <span id="candado"></span>
    <span style="position:relative;flex:1;min-width:0;display:flex;align-items:center">
      <span id="vista-dir"></span>
      <input id="campo-dir" spellcheck="false" data-t-ph="direccion_placeholder">
    </span>
    <span id="aviso-corte" role="status"></span>
  </form>
  <button id="b-parar" class="oculto" data-t-title="mandato_parar_titulo"><i></i><span data-t="mandato_parar"></span></button>
  <button id="b-licencia" class="oculto" data-t-title="licencia_boton_titulo"></button>
  <button id="b-escudo" data-t-title="escudo_boton_titulo"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M10 2.5l6 2.3v4.6c0 3.9-2.6 6.6-6 8.1-3.4-1.5-6-4.2-6-8.1V4.8z"/><path d="M7.3 10l2 2 3.6-3.8" stroke-linecap="round"/></svg><span id="b-escudo-n">0</span></button>
  <button class="icono" id="b-mandato" data-t-title="mandato_boton_titulo"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="14" height="14" rx="3"/><path d="M7 3v14M3 8h4M3 12h4"/><circle cx="12" cy="10" r="2"/></svg></button>
  <button class="icono" id="b-tachon" data-t-title="tachon_boton_titulo"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 6.5h13M3.5 10h5M3.5 13.5h13"/><rect x="10" y="8.2" width="6.5" height="3.6" rx="1" fill="currentColor" stroke="none"/></svg></button>
  <button class="icono" id="b-datos" data-t-title="mis_datos"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16.5c.8-3 3.2-4.5 6-4.5s5.2 1.5 6 4.5"/><circle cx="10" cy="7" r="3.2"/></svg></button>
  <button class="icono" id="b-menu" data-t-title="ajustes"><svg viewBox="0 0 20 20" fill="currentColor"><circle cx="10" cy="4.5" r="1.5"/><circle cx="10" cy="10" r="1.5"/><circle cx="10" cy="15.5" r="1.5"/></svg></button>
  <canvas id="guardia" data-t-title="linea_guardia_titulo"></canvas>
</div>
<script src="puente.js"></script>
<script src="barra.js"></script>
</body>
</html>
