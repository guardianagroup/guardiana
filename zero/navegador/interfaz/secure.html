<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title data-t="pestana_secure">GUARDIANA SECURE</title>
<link rel="stylesheet" href="diseno.css">
<link rel="stylesheet" href="comun.css">
<style>
html, body { min-height: 100%; background: var(--bg); }
body { background-image: linear-gradient(color-mix(in srgb, var(--fg) 4%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--fg) 4%, transparent) 1px, transparent 1px); background-size: 44px 44px; background-position: -1px -1px; }
header.top { display: flex; align-items: center; gap: 14px; padding: 14px 22px; border-bottom: 1px solid var(--line); background: var(--card); }
header.top .marca-g { font-size: 15px; }
header.top .marca-g .sec { color: var(--muted); }
header.top .chip { margin-left: auto; }
/* Two columns: the conversation on the left, the monitor always on the right. */
.secure { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: var(--e5); max-width: 1240px; margin: 0 auto; padding: var(--e5) 22px 48px; }
@media (max-width: 920px) { .secure { grid-template-columns: 1fr; } }
h1 { font: 600 clamp(28px, 3.6vw, 38px)/1.1 var(--display); letter-spacing: -.02em; margin: 0 0 12px; }
.frase { margin: 0 0 var(--e5); max-width: 38em; font-size: 16px; line-height: 1.5; color: var(--muted); }
.tres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
/* The conversation: connect, compare the numbers, talk. One card at a time. */
main > .tarjeta { margin-top: 14px; }
.conexion .c-dos { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
/* The three steps, read in two seconds: one invites, the other types the code, both compare. */
.pasos { list-style: none; margin: 0 0 16px; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pasos li { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.4; color: var(--muted); }
.pasos li b { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--mono); color: var(--accent-fg); background: var(--accent); }
.c-lado { padding: 14px; border: 1px solid var(--line); border-radius: var(--r-tarjeta); background: var(--campo); }
.c-lado h2 { font-size: 16px; }
.campo.codigo { font: 600 16px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.c-codigo .c-enviar { grid-column: 1 / -1; }
.c-codigo .via { color: var(--muted); font-size: 12px; }
@media (max-width: 680px) { .pasos { grid-template-columns: 1fr; } }
.conexion h2, .comparar h2, .chat h2 { margin: 0 0 6px; font: 600 15px/1.3 var(--display); }
.t { color: var(--muted); font-size: 13.5px; line-height: 1.45; margin: 0 0 10px; }
.c-fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.c-fila .campo { flex: 1; min-width: 180px; }
.c-puerto { font: 500 13px var(--mono); color: var(--ok); }
.c-codigo { margin-top: 12px; padding: 14px 16px; border: 1px solid color-mix(in srgb, var(--ok) 45%, var(--line)); background: color-mix(in srgb, var(--ok) 5%, var(--card)); border-radius: var(--r-tarjeta); display: grid; grid-template-columns: 1fr; gap: 6px; align-items: start; }
.c-codigo[hidden] { display: none; }
.c-codigo b { font: 600 clamp(22px, 2.2vw, 30px)/1.2 var(--mono); letter-spacing: .08em; color: var(--fg); user-select: all; white-space: nowrap; }
.c-codigo .t { grid-column: 1 / -1; margin: 0; font-size: 12.5px; }
.c-puerta-error { margin-top: 10px; color: var(--aviso); }
.c-puerta-error[hidden] { display: none; }
.numeros { display: flex; gap: 14px; margin: 12px 0 16px; }
.numeros b { font: 600 clamp(28px, 4vw, 40px)/1 var(--display); letter-spacing: .02em; padding: 12px 18px; border: 1px solid var(--line); border-radius: var(--r-tarjeta); background: var(--card); font-variant-numeric: tabular-nums; }
.c-nombre { display: grid; gap: 4px; margin: 0 0 12px; font-size: 13px; color: var(--muted); max-width: 320px; }
.chat-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mensajes { list-style: none; margin: 10px 0; padding: 12px; min-height: 220px; max-height: 50vh; overflow: auto; display: grid; gap: 6px; align-content: start; background: var(--campo); border-radius: var(--r-tarjeta); }
.mensajes li { max-width: 72%; padding: 8px 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }
.mensajes li.mio { justify-self: end; background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.mensajes li time { display: block; font: 10.5px var(--mono); opacity: .7; margin-top: 2px; }
.zona-archivo { border: 1px dashed var(--line); border-radius: var(--r-tarjeta); padding: 10px 14px; font-size: 13px; color: var(--muted); margin: 0 0 8px; }
.zona-archivo.sobre { border-color: var(--accent); background: var(--accent-suave); }
.c-progreso { display: grid; gap: 4px; font: 12px var(--mono); color: var(--muted); margin: 0 0 8px; }
.c-progreso i { display: block; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.c-progreso b { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.escribir { display: flex; gap: 8px; }
.resumen h2 { margin: 0 0 8px; font: 600 15px/1.3 var(--display); }
.r-datos { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; margin: 0 0 12px; font-size: 13.5px; }
.r-datos dt { color: var(--muted); } .r-datos dd { margin: 0; font-variant-numeric: tabular-nums; }
.r-nota { margin-top: 10px; font-size: 12px; }
/* A call ringing here (16 Oct 2026): who, with video or not, and the two answers. */
.timbre { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 10px 0; padding: 14px 16px; border: 1px solid color-mix(in srgb, var(--ok) 55%, var(--line)); border-radius: var(--r-tarjeta); background: color-mix(in srgb, var(--ok) 8%, var(--card)); }
.timbre[hidden] { display: none; }
.timbre .t-icono { width: 14px; height: 14px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); animation: latido 1.2s ease-out infinite; flex: none; }
.timbre .t-texto { display: grid; gap: 2px; margin-right: auto; }
.timbre .t-texto b { font: 600 16px/1.3 var(--display); }
.timbre .t-texto span { font-size: 13px; color: var(--muted); }
.boton.contestar { background: var(--ok); border-color: var(--ok); color: #fff; }
@keyframes latido { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }
@media (prefers-reduced-motion: reduce) { .timbre .t-icono, .llamando .l-estado::before { animation: none; } }
/* Calling: the screen says so and the button stays pressed until the other side answers. */
.llamando .pantallas { display: grid; place-items: center; aspect-ratio: auto; min-height: 120px; background: var(--campo); }
.llamando .rejilla, .llamando #c-local { display: none; }
.llamando .pantallas::after { content: attr(data-llamando); font: 600 17px/1.3 var(--display); color: var(--fg); }
.llamando .l-estado::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--ok); animation: latido 1.2s ease-out infinite; vertical-align: 1px; }
.boton.pulsado { background: var(--accent-suave); border-color: var(--accent); color: var(--accent); }
.boton:disabled { opacity: .5; cursor: default; }
/* A file that arrived: a card in the chat with what can be done with it. */
.mensajes li.archivo-li { padding: 10px 12px; }
.archivo { display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; align-items: center; }
.a-mini { width: 56px; height: 56px; border-radius: 8px; background: var(--campo); display: grid; place-items: center; overflow: hidden; font: 600 11px var(--mono); color: var(--muted); }
.a-mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
.a-info { display: grid; gap: 2px; min-width: 0; }
.a-info b { font-weight: 600; overflow-wrap: anywhere; }
.a-info span { font-size: 12px; color: var(--muted); }
.a-botones { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.a-botones .boton { padding: 6px 10px; font-size: 11px; }
.a-botones .boton.confirmar { background: var(--alerta); border-color: var(--alerta); color: #fff; }
.archivo.borrado .a-mini, .archivo.borrado .a-info b { opacity: .5; text-decoration: line-through; }
.mensajes li .a-entrega { display: block; font: 500 11px var(--mono); opacity: .85; margin-top: 3px; }
.mensajes li .a-tam { font: 11px var(--mono); opacity: .8; }
.permiso { display: grid; gap: 6px; margin: 10px 0; padding: 12px 14px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--alerta) 50%, var(--line)); background: color-mix(in srgb, var(--alerta) 8%, var(--card)); }
.permiso[hidden] { display: none; }
.perdida { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 10px 0; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 14px; }
.perdida[hidden] { display: none; } .perdida span { margin-right: auto; }
.permiso b { font: 600 15px/1.3 var(--display); } .permiso span { font-size: 13.5px; color: var(--muted); }
.timbre .t-aviso { display: block; font-size: 12.5px; color: var(--alerta); margin-top: 2px; }
.cortada-nota { margin: 0 0 10px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--aviso) 10%, var(--card)); border: 1px solid color-mix(in srgb, var(--aviso) 45%, var(--line)); font-size: 13.5px; }
.cortada-nota[hidden] { display: none; }
.chat.cortada #c-voz, .chat.cortada #c-video, .chat.cortada #c-movil, .chat.cortada .zona-archivo, .chat.cortada .escribir, .chat.cortada .mas, .chat.cortada .llamada, .chat.cortada .timbre { display: none; }
/* The call: the other person large, yourself small in the corner, as every call app does. */
.llamada { margin: 10px 0; }
.llamada[hidden] { display: none; }
.pantallas { position: relative; background: #0B1020; border-radius: var(--r-tarjeta); overflow: hidden; aspect-ratio: 16 / 9; }
.pantallas video { display: block; }
.rejilla { display: grid; width: 100%; height: 100%; gap: 4px; grid-template-columns: 1fr; }
.rejilla[data-n="2"], .rejilla[data-n="3"], .rejilla[data-n="4"] { grid-template-columns: 1fr 1fr; }
.rejilla[data-n="5"], .rejilla[data-n="6"] { grid-template-columns: 1fr 1fr 1fr; }
.tile { position: relative; background: #000; min-height: 0; }
.tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile-nombre { position: absolute; left: 8px; bottom: 8px; padding: 2px 8px; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; font: 500 11.5px var(--mono); }
.solo-voz .tile video { visibility: hidden; }
.solo-voz .tile { display: grid; place-items: center; background: transparent; }
.solo-voz .tile-nombre { position: static; font-size: 13px; }
.mas { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; padding: 8px 12px; border: 1px dashed var(--line); border-radius: var(--r-tarjeta); font-size: 13px; color: var(--muted); }
.mas[hidden] { display: none; }
.mas b { font: 600 15px var(--mono); letter-spacing: .06em; color: var(--fg); }
.mensajes li .de { display: block; font: 600 11.5px var(--texto); font-style: normal; color: var(--accent); margin-bottom: 2px; }
.comparar .quien { font-weight: 600; color: var(--fg); }
#c-local { position: absolute; right: 12px; bottom: 12px; width: 22%; border-radius: 8px; border: 1px solid rgba(255,255,255,.3); background: #000; }
.llamada-botones { margin-top: 8px; }
.l-estado { font: 500 12px var(--mono); color: var(--muted); margin-right: auto; }
.solo-voz #c-local { visibility: hidden; }
.solo-voz .pantallas { aspect-ratio: auto; min-height: 64px; display: grid; place-items: center; background: var(--campo); }
.solo-voz .rejilla { height: auto; }
.escribir .campo { flex: 1; }
/* The phone: the QR code large and alone, one sentence, and the state of the hand-off. */
.movil { margin: 10px 0; display: grid; gap: 10px; padding: 16px; border: 1px solid var(--line); border-radius: var(--r-tarjeta); background: var(--card); }
.movil[hidden] { display: none; }
.movil h3 { margin: 0; font: 600 15px/1.3 var(--display); }
.movil p { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
.movil .qr { display: grid; justify-items: center; gap: 8px; padding: 14px; background: #fff; border-radius: 12px; justify-self: start; }
.movil .qr svg { width: 232px; height: 232px; display: block; }
.movil .m-estado { display: flex; align-items: center; gap: 8px; font: 500 12.5px var(--mono); color: var(--muted); }
.movil .m-estado i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.movil .m-estado.si i { background: var(--ok); } .movil .m-estado.espera i { background: var(--aviso); }
.movil .m-ok { display: grid; gap: 8px; padding: 12px 14px; border: 1px solid color-mix(in srgb, var(--aviso) 55%, var(--line)); border-radius: 12px; background: color-mix(in srgb, var(--aviso) 6%, var(--card)); }
.movil .m-ok p { color: var(--fg); }
.movil .m-habla { font-size: 14px; color: var(--fg); }
@media (max-width: 680px) { .conexion .c-dos { grid-template-columns: 1fr; } .mensajes li { max-width: 92%; } }
.tres article.tarjeta { box-shadow: var(--sombra); }
.tres h2 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
.tres p { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--muted); }
@media (max-width: 680px) { .tres { grid-template-columns: 1fr; } }

/* The one state on top: a colour, a word, a sentence, four plain lines. The numbers live
   below, folded, so a lawyer or a doctor reads the top and only opens the rest if they want. */
.estado-g { display: grid; gap: 10px; padding: 18px 18px 16px; border-width: 1px; transition: border-color .3s, background-color .3s; }
.estado-g .fila { display: flex; align-items: center; gap: 12px; }
.estado-g .punto { width: 14px; height: 14px; border-radius: 50%; flex: none; background: var(--muted-2); transition: background-color .3s; }
.estado-g .palabra { font: 600 22px/1.1 var(--display); letter-spacing: -.01em; }
.estado-g .frase-g { margin: 0; font-size: 15px; color: var(--fg); }
.estado-g ul { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 7px; }
.estado-g li { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; line-height: 1.45; color: var(--muted); }
.estado-g li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; margin-top: 7px; flex: none; background: var(--line); }
.estado-g li.ok { color: var(--fg); } .estado-g li.ok::before { background: var(--ok); }
.estado-g li.aviso { color: var(--fg); } .estado-g li.aviso::before { background: var(--aviso); }
.estado-g li.alerta { color: var(--alerta); } .estado-g li.alerta::before { background: var(--alerta); }
.estado-g.protegida { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); background: color-mix(in srgb, var(--ok) 5%, var(--card)); }
.estado-g.protegida .punto { background: var(--ok); animation: late-g 4s ease-in-out infinite; }
.estado-g.protegida .palabra { color: var(--ok); }
.estado-g.revisar { border-color: color-mix(in srgb, var(--aviso) 55%, var(--line)); background: color-mix(in srgb, var(--aviso) 6%, var(--card)); }
.estado-g.revisar .punto { background: var(--aviso); } .estado-g.revisar .palabra { color: var(--aviso); }
.estado-g.pausada { border-color: var(--alerta); background: color-mix(in srgb, var(--alerta) 6%, var(--card)); }
.estado-g.pausada .punto { background: var(--alerta); } .estado-g.pausada .palabra { color: var(--alerta); }
@keyframes late-g { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 45%, transparent); } 50% { box-shadow: 0 0 0 7px transparent; } }
@media (prefers-reduced-motion: reduce) { .estado-g .punto { animation: none !important; } }
.estado-g .nota-g { margin: 2px 0 0; font-size: 11.5px; color: var(--muted); }
.estado-g .mas { justify-self: start; margin-top: 2px; }
.detalles[hidden] { display: none; }
/* The stop: why, since when, what is still pending, and the one way out. */
.pausa { border-color: var(--alerta); display: grid; gap: 8px; padding: 18px; }
.pausa[hidden] { display: none; }
.pausa .p-titulo { margin: 0; font: 600 18px/1.2 var(--display); color: var(--alerta); }
.pausa p { margin: 0; font-size: 13.5px; line-height: 1.5; }
.pausa .p-motivo b { font-weight: 600; }
.pausa .p-hora { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.pausa .p-desde { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.pausa .p-ahora, .pausa .p-reanuda { color: var(--muted); }
.pausa .p-pendiente { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.pausa .p-pendiente li::before { content: "· "; color: var(--alerta); }
.pausa .p-pendiente li.lista { color: var(--ok); }
.pausa .p-botones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.pausa .p-nota { font-size: 11.5px; color: var(--muted); }

/* The monitor: one card, sections with a mono caption, two-column rows of label and value. */
aside.monitor { position: sticky; top: var(--e5); align-self: start; display: grid; gap: var(--e3); max-height: calc(100vh - 2 * var(--e5)); overflow: auto; }
.detalles { display: grid; gap: var(--e3); }
.monitor .tarjeta { padding: 14px 16px; }
.monitor .cabecera { display: flex; align-items: center; gap: 10px; }
.monitor .cabecera .rotulo { flex: 1; }
.monitor .latido { width: 8px; height: 8px; border-radius: 50%; background: var(--muted-2); flex: none; }
.monitor .latido.vivo { background: var(--ok); box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 55%, transparent); animation: late 1.6s infinite; }
@keyframes late { 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.monitor .frase-m { margin: 6px 0 0; font-size: 12.5px; line-height: 1.45; color: var(--muted); }
.monitor dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 10px 0 0; font-size: 13px; }
.monitor dt { color: var(--muted); white-space: nowrap; }
.monitor dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.monitor dd.mono { font-family: var(--mono); font-size: 12px; letter-spacing: .02em; }
.monitor dd.huella { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; letter-spacing: .04em; }
.monitor .vacio { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); }
.monitor ol { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.monitor li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: baseline; font-size: 12.5px; padding: 6px 0; border-top: 1px solid var(--line); }
.monitor li:first-child { border-top: 0; }
.monitor li time { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.monitor li .chip { grid-column: 1 / -1; justify-self: start; }
.monitor .nota { margin: 10px 0 0; font-size: 11.5px; color: var(--muted); }
</style>
</head>
<body>
<header class="top">
  <span class="marca-g">GUARDIANA <span class="sec" data-t="sec_titulo">SECURE</span></span>
  <span class="chip" id="m-estado-chip" data-t="sec_sin_sesion"></span>
</header>
<div class="secure">
<main>
  <h1><span data-t="sec_titulo">SECURE</span></h1>
  <p class="frase" data-t="sec_frase_v1"></p>

  <section class="tarjeta conexion" id="c-conexion">
    <ol class="pasos"><li><b>1</b><span data-t="sec_paso_1"></span></li><li><b>2</b><span data-t="sec_paso_2"></span></li><li><b>3</b><span data-t="sec_paso_3"></span></li></ol>
    <div class="c-dos">
      <div class="c-lado" id="c-lado-invitar">
        <h2 data-t="sec_c_invitar"></h2>
        <p class="t" data-t="sec_c_invitar_texto"></p>
        <label class="c-nombre"><span data-t="sec_c_tu_nombre"></span><input class="campo" id="c-yo" data-t-ph="sec_c_tu_nombre_ph" autocomplete="off" maxlength="60"></label>
        <div class="c-fila"><button type="button" class="boton principal" id="c-escuchar" data-t="sec_c_invitar_boton"></button><span class="c-puerto" id="c-puerto" hidden></span></div>
        <div class="c-codigo" id="c-codigo-caja" hidden>
          <span class="rotulo" data-t="sec_c_codigo_rotulo"></span>
          <b id="c-codigo"></b>
          <div class="c-fila c-enviar"><button type="button" class="boton chico" id="c-copiar" data-t="sec_c_copiar"></button><button type="button" class="boton chico secundario" id="c-whatsapp" data-t="sec_c_whatsapp"></button><button type="button" class="boton chico secundario" id="c-correo" data-t="sec_c_correo"></button></div>
          <p class="t" id="c-codigo-texto" data-t="sec_c_listo"></p>
