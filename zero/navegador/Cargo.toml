[package]
name = "guardiana-zero-navegador"
description = "GUARDIANA ZERO for Windows: the window, the tabs and the hooks into Microsoft Edge WebView2"
version = "1.0.7"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/guardianagroup/guardiana"
authors = ["Guardiana"]
publish = false
build = "build.rs"

[[bin]]
name = "guardiana-zero"
path = "src/main.rs"

# A workspace of its own: this program builds only on Windows (GitHub Actions, windows-latest),
# while everything that decides (crates/zero) lives in the main workspace and is tested on every
# system. Keeping them apart keeps the main Cargo.lock free of Windows-only crates.
[workspace]

[dependencies]
# The browser's brain: tabs, cuts, figures, mandates, receipts (this repository).
guardiana-zero = { path = "../../crates/zero" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Rust bindings for the WebView2 COM API (MIT), generated from Microsoft's own metadata; the same
# bindings the Tauri project uses. Statically links WebView2LoaderStatic.lib: nothing to ship
# beside the .exe.
webview2-com = "=0.39.1"
windows-core = "0.62"
# Microsoft's Win32 bindings (MIT/Apache-2.0): the window, DPI, COM, the Downloads folder.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
# Puts the icon, the manifest and the version into the .exe (MIT).
winresource = "0.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = 3

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
