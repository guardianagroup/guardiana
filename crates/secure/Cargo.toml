[package]
name = "guardiana-secure"
description = "GUARDIANA SECURE: an Olm conversation between two identities. No network, no DNS service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
vodozemac = { workspace = true }
getrandom = { workspace = true }

# DPAPI, current-user scope, only when this crate is built for Windows.
# The DNS service does not depend on guardiana-secure, so it does not get this.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

# Keychain Services. Only the local wrapping key lives here, never the message.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }

[lints]
workspace = true
