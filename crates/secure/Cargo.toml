[package]
name = "guardiana-secure"
description = "GUARDIANA SECURE: an Olm conversation between two identities. No network, no DNS service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
vodozemac = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
qrcode = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
# Files in blocks (archivo.rs): the AEAD family vodozemac already brings into the tree.
chacha20poly1305 = { workspace = true }
# The post-quantum layer (cuantico.rs).
ml-kem = { workspace = true }
# The delivery room's pieces (flujo.rs): AES-256-GCM, the one authenticated cipher every
# receiver's browser has in WebCrypto; ring's, already in the tree for TLS.
ring = { workspace = true }
# Keys wiped when dropped (flujo.rs); already in the tree through ml-kem and vodozemac.
zeroize = { workspace = true }

[lints]
workspace = true
