[package]
name = "guardiana-zero"
description = "GUARDIANA ZERO: the browser's portable core (destinations, marked data, redaction, mandates, signed receipts, data book)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# The window, the tabs and the engine hooks live in zero/ (Windows, WebView2), a separate
# workspace built on Windows only; everything that decides lives here and is tested everywhere.
[dependencies]
guardiana-lists = { workspace = true }
guardiana-core = { workspace = true }
# The subscription (decided 9 Oct 2026): ZERO comes with GUARDIANA's, with seven days of its own,
# and uses GUARDIANA's own licence rules and gateway calls instead of a second copy of them.
guardiana-license = { workspace = true }
# GUARDIANA SECURE (plan of 15 Oct 2026): the browser shows its monitor in the SECURE tab. The
# DNS service still does not link it.
guardiana-secure = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
ring = { workspace = true }
base64 = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# The relay, run on this computer, for the test where two conversations meet through it.
guardiana-rele = { workspace = true }
tokio = { workspace = true }
