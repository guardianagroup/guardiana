[package]
name = "guardiana-license"
description = "7-day trial and one-connection activation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
guardiana-core = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }
# OS randomness for the licence's own secret, made once per installation (review of 1 Oct
# 2026, entry 9: the panel token used to play that role, and losing it lost the licence).
# Already in the tree: the panel uses it for its token.
getrandom = { workspace = true }

# windows-sys is already in the tree through other dependencies, same version. 1.0.55: the anchor's registry key is
# read with Windows' own functions (read only) instead of starting `reg.exe` each time the licence is asked, which the
# resolver did every thirty seconds (src/ancla/registro.rs). Writing still goes through `reg add`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

[lints]
workspace = true
