[package]
name = "guardiana-apps"
description = "Which program asked for each name, on Windows and read-only (brief §12.3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
guardiana-core = { path = "../core" }
# El escudo (1.0.52): which files hold a saved secret (pure rules, no system calls).
guardiana-escudo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Solo en Windows, y solo para leer:
# - ferrisetw: envoltorio seguro del consumidor de ETW, que es el canal por el que el propio
#   Windows cuenta qué proceso pidió cada nombre. Es la librería que el brief nombra (§12.3);
#   la alternativa era llamar a la API de ETW con `unsafe`, que este proyecto no permite.
# - windows-sys: ya entra en el árbol por otras dependencias; se usa para traducir un número de
#   proceso a la ruta de su programa, y nada más.
[target.'cfg(windows)'.dependencies]
ferrisetw = "1.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    # 1.0.45, «Vigilancia»: the camera and microphone record, read straight from the registry.
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_Security",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    # 1.0.48, «Vigía»: las sesiones de escritorio remoto (WTS) y qué programa abrió una conexión
    # al panel (la tabla TCP con su proceso), para no avisar del navegador desde el que se llama.
    "Win32_System_RemoteDesktop",
    "Win32_NetworkManagement_IpHelper",
    # The VPN's adapter: wireguard.dll, loaded from its full path (wireguard_nt.rs); its address, routes and settings
    # (red_vpn.rs: IP Helper's rows use WinSock's addresses and NDIS's interface ids).
    "Win32_System_LibraryLoader",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_Ndis",
] }
sha2 = { workspace = true }
# The VPN (in preparation): its cut-off switch's plan (corte_vpn.rs) and, in the adapter's real test, the keys and the
# configuration's bytes (wireguard_nt.rs). Pure rules, no system calls.
guardiana-tunel = { workspace = true }

# The adapter's configuration read back from the driver (wireguard_nt.rs) may carry the private key: wiped on drop.
# The whole tunnel's real test (tunel_win.rs) makes up a sign-up, whose preshared key is wiped too.
zeroize = { workspace = true }
