#cloud-config
# GUARDIANA SECURE · relé ciego. Pegar entero en «Cloud config» al crear el servidor
# (Hetzner Cloud, Ubuntu 24.04). Instala Rust, compila guardiana-rele desde el código
# publicado y lo deja arrancado en el puerto 443 como un usuario sin privilegios. No
# guarda nada: ni direcciones ni mensajes; solo une dos conexiones con el mismo código.
# Desde el 17 oct 2026 instala también el servicio de llamadas (TURN, coturn, sin registros).
package_update: true
packages: [build-essential, pkg-config, git, ufw, curl]
users:
  - name: rele
    system: true
    shell: /usr/sbin/nologin
write_files:
  - path: /etc/systemd/system/guardiana-rele.service
    content: |
      [Unit]
      Description=GUARDIANA SECURE blind relay
      After=network-online.target
      Wants=network-online.target
      [Service]
      User=rele
      ExecStart=/opt/guardiana-rele/guardiana-rele 0.0.0.0:443
      Restart=always
      RestartSec=2
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      CapabilityBoundingSet=CAP_NET_BIND_SERVICE
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      LimitNOFILE=65536
      [Install]
      WantedBy=multi-user.target
  - path: /opt/guardiana-rele/actualizar.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      # Recompila el relé desde el main publicado y lo reinicia. Se puede ejecutar cuando
      # haya una versión nueva: bash /opt/guardiana-rele/actualizar.sh
      set -uo pipefail
      export PATH="/root/.cargo/bin:$PATH"
      cd /opt/guardiana-rele
      # Up to two hours of tries, two minutes apart: the first server may come up before the
      # relay's code reaches main.
      for intento in $(seq 1 60); do
        if [ -d guardiana/.git ]; then git -C guardiana pull -q --ff-only; else git clone -q --depth 1 https://github.com/guardianagroup/guardiana.git; fi
        if (cd guardiana && cargo build --release -p guardiana-rele --locked); then break; fi
        echo "intento $intento: todavía no compila; espero dos minutos"
        sleep 120
      done
      install -m 0755 guardiana/target/release/guardiana-rele /opt/guardiana-rele/guardiana-rele || exit 1
      systemctl daemon-reload
      systemctl enable --now guardiana-rele
      systemctl restart guardiana-rele
      systemctl --no-pager status guardiana-rele | head -5
runcmd:
  - ufw allow OpenSSH
  - ufw allow 443/tcp
  - ufw allow 80/tcp
  # Llamadas (TURN, 17 oct 2026): coturn en 3478 y sus puertos de relevo UDP.
  - ufw allow 3478/udp
  - ufw allow 3478/tcp
  - ufw allow 49160:49400/udp
  - ufw --force enable
  - curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
  - bash /opt/guardiana-rele/actualizar.sh
  # El segundo servidor (América, 16 oct 2026) usa el mismo archivo cambiando solo este nombre
  # por rele-am.guardianagroup.com, una vez que el DNS apunte a él.
  - bash /opt/guardiana-rele/guardiana/crates/rele/servidor-tls.sh rele.guardianagroup.com
  # Las llamadas por WebRTC (17 oct 2026): coturn y el secreto que comparte con el relé.
  # En América, igual que arriba: rele-am.guardianagroup.com.
  - bash /opt/guardiana-rele/guardiana/crates/rele/turn.sh rele.guardianagroup.com
