[package]
name = "guardiana-rele"
description = "GUARDIANA SECURE's blind relay: joins two connections that share a room (two computers, or a computer and its owner's phone) and passes bytes it cannot read (everything arrives encrypted end to end); keeps nothing, writes no addresses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "guardiana-rele"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
# Phones (16 Oct 2026): TLS with the server's own certificate, the WebSocket handshake's SHA-1
# and base64.
rustls = { workspace = true }
tokio-rustls = { workspace = true }
ring = { workspace = true }
base64 = { workspace = true }

[lints]
workspace = true
