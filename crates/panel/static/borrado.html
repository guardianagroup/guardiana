<main class="lente" data-lente="borrado">
<div id="no-session" class="card hidden"><strong data-t="sin_sesion_titulo"></strong> <span data-t="sin_sesion_texto"></span></div>
<nav class="lente-miga" data-t-label="lente_miga"><a href="/sabe-de-ti" data-t="menu_privacidad"></a><i aria-hidden="true"></i><span aria-current="page" data-t="nav_borrado"></span></nav>
<header class="lente-cabeza"><div><h1 data-t="nav_borrado"></h1><p class="lente-lead" data-t="lente_borrado_lead"></p></div></header>
<section class="lente-cifras" aria-live="polite">
  <div class="lente-cifra"><b class="n"></b><span class="l" data-t="lente_borrado_c1"></span></div>
  <div class="lente-cifra"><b class="n"></b><span class="l" data-t="lente_borrado_c2"></span></div>
  <div class="lente-cifra"><b class="n"></b><span class="l" data-t="lente_borrado_c3"></span></div>
  <div class="lente-cifra"><b class="n"></b><span class="l" data-t="lente_borrado_c4"></span></div>
</section>
<div class="lente-cuerpo">
<div class="lente-principal">
<section class="lente-tarjeta"><div class="lente-tc"><h2 data-t="lente_borrado_pasos"></h2></div><div class="lente-tb"><ol class="lente-pasos">
  <li><b>1</b><p data-t="borrado_paso1"></p></li>
  <li><b>2</b><p data-t="borrado_paso2"></p></li>
  <li><b>3</b><p data-t="borrado_paso3"></p></li>
  <li><b>4</b><p data-t="borrado_paso4"></p></li>
</ol></div></section>
<section class="lente-tarjeta" id="b-datos"><div class="lente-tc"><h2 data-t="borrado_paso_datos"></h2></div><div class="lente-tb"><form class="filters" id="b-datos-form">
    <label><span data-t="borrado_campo_nombre"></span><input id="b-nombre" type="text" autocomplete="name" spellcheck="false"></label>
    <label><span data-t="borrado_campo_correo"></span><input id="b-correo" type="email" autocomplete="email" spellcheck="false"></label>
    <label><span data-t="borrado_campo_pais"></span><select id="b-pais"></select></label>
    <label><span data-t="borrado_campo_idioma"></span><select id="b-idioma"><option value="es">Español</option><option value="en">English</option><option value="pt">Português</option></select></label>
  </form>
  <p id="b-datos-msg" class="bad hidden" role="status" aria-live="polite"></p>
  <p><label class="b-check"><input id="b-recordar" type="checkbox"> <span data-t="borrado_recordar"></span></label></p>
  <p><label class="b-check"><input id="b-evidencia" type="checkbox" checked> <span data-t="borrado_campo_evidencia"></span></label></p>
  <p id="b-qc" class="muted hidden" data-t="borrado_qc_frances"></p>
  <p id="b-ley-corta" class="b-corta"></p>
  <details class="b-plegable" id="b-ley-det"><summary data-t="borrado_ver_ley"></summary><div id="b-ley"></div></details>
  <p class="muted" data-t="borrado_privado"></p></div></section>
<section class="lente-pila">
<h2 data-t="borrado_paso_empresa"></h2>
<p class="muted" id="b-empresa-lead"></p>
<div class="card hidden" id="b-drop">
  <h3 data-t="borrado_drop_titulo"></h3>
  <p data-t="borrado_drop_texto"></p>
  <p><a class="btn secondary" href="https://consumer.drop.privacy.ca.gov" target="_blank" rel="noopener noreferrer" data-t="borrado_drop_enlace"></a></p>
  <p class="muted"><a href="https://privacy.ca.gov/drop/" target="_blank" rel="noopener noreferrer" data-t="borrado_drop_mas"></a> · <span data-t="borrado_drop_debajo"></span></p>
</div>
<div id="b-vistas"></div>
<p id="b-callados" class="muted hidden"></p>
<details class="b-plegable" id="b-otras">
  <summary id="b-otras-titulo"></summary>
  <div class="card">
    <p class="muted" data-t="borrado_otras_explica"></p>
    <form class="filters" id="b-buscar-form"><label><span data-t="borrado_buscar"></span><input id="b-buscar" type="search" autocomplete="off" spellcheck="false" data-t-label="borrado_buscar"></label></form>
    <ul class="recibo b-lista" id="b-lista"></ul>
    <p id="b-lista-vacia" class="muted hidden" data-t="borrado_buscar_nada"></p>
  </div>
</details>
<details class="b-plegable" id="b-ver-carta">
  <summary data-t="borrado_ver_carta"></summary>
  <div class="card" id="b-carta-card">
    <form class="filters" id="b-carta-form">
      <label><span data-t="borrado_col_empresa"></span><select id="b-corredor"></select></label>
      <label><span data-t="borrado_campo_idioma"></span><select id="b-idioma-carta"><option value="es">Español</option><option value="en">English</option><option value="pt">Português</option></select></label>
    </form>
    <p id="b-canal" class="muted"></p>
    <p><strong id="b-asunto"></strong></p>
    <textarea id="b-texto" class="mono wide" rows="22" readonly data-t-label="borrado_ver_carta"></textarea>
    <p class="b-acciones lente-fila-botones">
      <button type="button" class="secondary" id="b-copiar" data-t="borrado_copiar"></button>
      <button type="button" class="secondary" id="b-descargar" data-t="borrado_descargar"></button>
    </p>
    <p id="b-msg" class="bad" role="status" aria-live="polite"></p>
  </div>
</details>
</section>
<section class="lente-tarjeta"><div class="lente-tc"><h2 data-t="borrado_paso_reloj"></h2></div><div class="lente-tb"><p class="muted" data-t="borrado_reloj_lead"></p><p class="muted"><span data-t="borrado_reloj_en_expedientes"></span> <a href="/expedientes" data-t="exp_aviso_ver"></a></p><p id="b-envio-msg" class="bad" role="status" aria-live="polite"></p><div id="b-envios"></div></div></section>
<details class="lente-tarjeta lente-mas"><summary data-t="lente_mas"></summary><div class="lente-mas-c"><p data-t="borrado_lead"></p><p data-t="borrado_aviso_abogados"></p><p data-t="borrado_reloj_limite"></p></div></details>

    <p class="lente-s2" data-t="lente_borrado_s2"></p>

    <p class="lente-estado" hidden></p>

  </div>
  <p class="lente-pie"></p>
</aside>
</div>
