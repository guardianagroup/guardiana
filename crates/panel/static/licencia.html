<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Guardiana · Licencia</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="licencia">
<header class="top">
  <span class="brand">Guardiana</span>
  <nav>
    <a href="/" data-t="nav_radiografia">Radiografía</a>
    <a href="/ia" data-t="nav_ia">Tu IA</a>
    <a href="/extracto" data-t="nav_extracto">Extracto</a>

    <a href="/sabe-de-ti" data-t="nav_sabe">Lo que Guardiana sabe de ti</a>
    <a href="/reglas" data-t="nav_reglas">Reglas</a>
    <a href="/informe" data-t="nav_informe">Informe semanal</a>
    <a href="/hogar" data-t="nav_hogar">Modo Hogar</a>
    <a href="/licencia" aria-current="page" data-t="nav_licencia">Licencia</a>
    <a href="/verify" data-t="nav_verify">Verificar</a>
    <a href="/estado" data-t="nav_estado">Estado</a>
  </nav>
</header>
<main>
<div id="no-session" class="card hidden"><strong data-t="sin_sesion_titulo"></strong> <span data-t="sin_sesion_texto"></span></div>
<h1 data-t="licencia_titulo"></h1>
<p class="lead" data-t="licencia_lead"></p>
<div class="card"><p id="l-estado"></p><p class="muted" id="l-prueba"></p><p class="muted hidden" id="l-dev" data-t="licencia_dev"></p></div>
<h2 data-t="licencia_clave_titulo"></h2>
<p class="lead" id="l-clave-lead"></p>
<form id="l-clave" class="filters"><label><span data-t="licencia_clave_campo"></span><input name="clave" size="40" autocomplete="off"></label><button type="submit" data-t="licencia_clave_boton"></button></form>
<p id="l-clave-msg" class="muted"></p>
<h2 data-t="licencia_conexiones_titulo"></h2>
<div class="card wrap"><table><thead><tr><th data-t="col_fecha"></th><th data-t="col_host"></th><th data-t="col_bytes"></th></tr></thead><tbody id="l-conexiones"></tbody></table></div>
<p class="limit" data-t="licencia_limite"></p>
</main>
<footer><span data-t="pie"></span></footer>
<script src="/static/app.js"></script>
</body>
</html>
