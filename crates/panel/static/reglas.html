  <label><span data-t="f_patron"></span><input name="pattern" id="n-pattern" placeholder="ejemplo.com" data-t-placeholder="f_patron_ejemplo"></label>

</form>
<p id="n-msg" class="muted" role="status" aria-live="polite"></p></div></section>
