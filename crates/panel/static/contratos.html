<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>GUARDIANA · Contratos</title>
<link rel="stylesheet" href="/static/diseno.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/lente.css">
<link rel="preload" href="/static/fonts/HankenGrotesk-var.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="/static/fonts/SchibstedGrotesk-var.woff" as="font" type="font/woff" crossorigin>
<script src="/static/arranque.js"></script>
</head>
<body data-page="contratos">
<header class="top">
  <a class="brand" href="/" data-t-title="ir_inicio"><span class="brand-txt">GUARDIANA<small data-t="lema"></small></span></a>
  <nav>
    <a href="/por-dentro" data-t="menu_en_vivo">En vivo</a>
    <a href="/extracto" data-t="menu_actividad">Actividad</a>
    <a href="/contratos" aria-current="true" data-t="nav_contratos">Contratos</a>
    <a href="/revision" data-t="menu_diagnostico">Diagnóstico</a>
    <a href="/sabe-de-ti" data-t="menu_privacidad">Privacidad</a>
    <a href="/hogar" data-t="menu_ajustes">Ajustes</a>
  </nav>
</header>
<main class="lente" data-lente="contratos">
<div id="no-session" class="card hidden"><strong data-t="sin_sesion_titulo"></strong> <span data-t="sin_sesion_texto"></span></div>
<nav class="lente-miga" data-t-label="lente_miga"><a href="/extracto" data-t="menu_actividad"></a><i aria-hidden="true"></i><span aria-current="page" data-t="nav_contratos"></span></nav>
<header class="lente-cabeza"><div><h1 data-t="nav_contratos"></h1><p class="lente-lead" data-t="lente_ct_lead"></p></div></header>
<section class="lente-cifras" aria-live="polite">
  <div class="lente-cifra"><b class="n" id="ct-n-vigilados"></b><span class="l" data-t="lente_ct_c1"></span></div>
  <div class="lente-cifra"><b class="n" id="ct-n-actualizaciones"></b><span class="l" data-t="lente_ct_c2"></span></div>
  <div class="lente-cifra"><b class="n" id="ct-n-cambiaron"></b><span class="l" data-t="lente_ct_c3"></span></div>
  <div class="lente-cifra"><b class="n" id="ct-n-cortadas"></b><span class="l" data-t="lente_ct_c4"></span></div>
</section>
<div class="lente-cuerpo">
<div class="lente-principal">
<p class="lente-nota hidden" id="ct-solo-windows" data-t="ct_solo_windows"></p>
<p id="ct-msg" class="ct-msg" role="status" aria-live="polite"></p>
<section class="lente-tarjeta" id="ct-linea-tarjeta"><div class="lente-tc"><h2 data-t="lente_ct_linea"></h2><div class="lente-tc-der"><span data-t="lente_ct_ventana"></span></div></div><div class="lente-tb sin-margen"><ol class="ct-linea" id="ct-linea"></ol></div></section>
<section class="ct-programas" id="ct-programas-sec" aria-labelledby="ct-programas-t">
  <h2 id="ct-programas-t" class="lente-oculto" data-t="lente_ct_programas"></h2>
  <div class="lente-buscar">
    <label class="lente-campo"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><input type="search" id="ct-buscar" autocomplete="off" spellcheck="false" data-t-placeholder="lente_ct_buscar" data-t-label="lente_ct_buscar"></label>
    <div class="lente-fila-botones" role="group" id="ct-filtros">
      <button type="button" class="lente-chip" data-filtro="todos" aria-pressed="true" id="ct-f-todos"></button>
      <button type="button" class="lente-chip" data-filtro="cambios" aria-pressed="false" data-t="lente_ct_f_cambios"></button>
      <button type="button" class="lente-chip" data-filtro="aprendiendo" aria-pressed="false" data-t="lente_ct_f_aprendiendo"></button>
      <button type="button" class="lente-chip" data-filtro="reglas" aria-pressed="false" data-t="lente_ct_f_reglas"></button>
    </div>
  </div>
  <div class="ct-tarjetas" id="ct-programas"></div>
  <div class="ct-mas" id="ct-mas" hidden><span id="ct-mostrando"></span><button type="button" class="boton" id="ct-ver-todos" data-t="lente_ct_ver_todos"></button></div>
</section>
<section class="lente-tarjeta"><div class="lente-tc"><h2 data-t="ct_historial"></h2><div class="lente-tc-der"><span id="ct-comprobado" class="ct-msg" role="status" aria-live="polite"></span><button type="button" class="boton chico" id="ct-comprobar" data-t="ct_comprobar"></button></div></div><div class="lente-tb sin-margen"><ol id="ct-registro" class="ct-registro" reversed></ol></div></section>
<details class="lente-tarjeta lente-mas"><summary data-t="lente_mas"></summary><div class="lente-mas-c"><p data-t="ct_lead"></p><p id="ct-como"></p><p data-t="ct_limite"></p><p data-t="ct_limite_corte"></p><p data-t="ct_historial_lead"></p></div></details>
<aside class="lente-inspector" id="ct-inspector" hidden aria-labelledby="ct-i-nombre" tabindex="-1">
  <div class="li-cab"><span class="lente-ini grande" id="ct-i-ini"></span><div><h2 id="ct-i-nombre"></h2><div class="li-meta" id="ct-i-meta"></div></div><button type="button" class="boton-icono" id="ct-i-cerrar" data-t-label="lente_cerrar" data-t-title="lente_cerrar"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
  <div id="ct-i-cuerpo"></div>
</aside>
</div>
<aside class="lente-lado">
  <div class="lente-significa">
    <span class="rotulo" data-t="lente_que_significa"></span>
    <p class="lente-s1" data-t="lente_ct_s1"></p>
    <p class="lente-s2" data-t="lente_ct_s2"></p>
    <div class="lente-sep"></div>
    <p class="lente-estado" hidden></p>
    <a class="boton principal lente-accion" id="ct-accion" href="#ct-programas-sec" data-t="lente_ct_ver_programas"></a>
    <a class="boton lente-accion" id="ct-exportar" href="#" data-t="lente_ct_exportar"></a>
  </div>
  <p class="lente-pie"></p>
</aside>
</div>
</main>
<script src="/static/lente.js"></script>
<script src="/static/contratos.js"></script>
<script src="/static/interruptor.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
