<html lang="es">
<head>

<title>GUARDIANA · Visión profunda</title>
<link rel="stylesheet" href="/static/diseno.css">
<link rel="stylesheet" href="/static/style.css">

<link rel="preload" href="/static/fonts/SchibstedGrotesk-var.woff" as="font" type="font/woff" crossorigin>

</head>
<body data-page="vision">
<header class="top">
  <a class="brand" href="/" data-t-title="ir_inicio"><span class="brand-txt">GUARDIANA<small data-t="lema"></small></span></a>
  <nav>
    <a href="/por-dentro" data-t="menu_en_vivo">En vivo</a>
    <a href="/extracto" data-t="menu_actividad">Actividad</a>
    <a href="/contratos" data-t="nav_contratos">Contratos</a>
    <a href="/revision" aria-current="true" data-t="menu_diagnostico">Diagnóstico</a>

    <a href="/hogar" data-t="menu_ajustes">Ajustes</a>
  </nav>
</header>
<main class="lente vp" data-lente="vision">
<div id="no-session" class="card hidden"><strong data-t="sin_sesion_titulo"></strong> <span data-t="sin_sesion_texto"></span></div>
<nav class="lente-miga" data-t-label="lente_miga"><a href="/revision" data-t="menu_diagnostico"></a><i aria-hidden="true"></i><span aria-current="page" data-t="nav_vision"></span></nav>
<header class="lente-cabeza"><div><h1 data-t="nav_vision"></h1><p class="lente-lead" data-t="lente_vp_lead"></p></div></header>
<section class="lente-cifras" aria-live="polite">
  <div class="lente-cifra"><b class="n" id="vp-subido"></b><span class="l" data-t="vp_subido"></span></div>
  <div class="lente-cifra"><b class="n" id="vp-bajado"></b><span class="l" data-t="vp_bajado"></span></div>
  <div class="lente-cifra"><b class="n" id="vp-sin-dns"></b><span class="l" data-t="vp_sin_dns"></span></div>
  <div class="lente-cifra"><b class="n" id="vp-reenviado"></b><span class="l" data-t="vp_reenviado"></span></div>
</section>
<div class="lente-cuerpo">
<div class="lente-principal">
<section id="vp-no" class="tarjeta vp-no" hidden>
  <strong data-t="vp_no_disponible_titulo">No disponible todavía</strong>
  <p class="muted" data-t="vp_no_disponible"></p>
</section>

<div id="vp-todo" hidden>
  <div class="vp-barra">
    <div class="vp-dias" id="vp-dias" role="group">
      <button type="button" class="boton chico" data-dias="1" data-t="vp_24h">24 horas</button>
      <button type="button" class="boton chico" data-dias="7" data-t="vp_7d">7 días</button>
    </div>
    <span id="vp-vivo" class="vp-vivo muted" aria-live="polite"></span>
  </div>


  <p id="vp-cadena" class="vp-cadena"></p>

  <section class="tarjeta vp-archivos">
    <div class="vp-archivos-cab">
      <div>
        <h2 data-t="vp_archivos_titulo">Posibles transferencias</h2>
        <p class="muted" data-t="vp_archivos_que"></p>
      </div>
      <button type="button" id="vp-archivos-boton" class="boton"></button>
    </div>
    <p id="vp-archivos-estado" class="muted"></p>
    <ul id="vp-transferencias" class="vp-transferencias"></ul>
  </section>

  <section id="vp-defender" class="tarjeta vp-defender" hidden>
    <h2 data-t="vp_defender_titulo">Microsoft Defender y su nube</h2>
    <p class="muted" data-t="vp_defender_que"></p>
    <dl id="vp-defender-valores" class="vp-defender-valores"></dl>
    <p class="muted"><a class="enlace" href="https://learn.microsoft.com/en-us/powershell/module/defender/set-mppreference" rel="noopener noreferrer" target="_blank" data-t="vp_defender_fuente">Lo que documenta Microsoft</a></p>
  </section>

<section class="lente-tarjeta lente-sec">
<h2 data-t="vp_programas_titulo">Programa por programa</h2>
  <p class="muted" data-t="vp_programas_que"></p>
  <div id="vp-programas" class="vp-programas"></div>
</section>

  <section class="tarjeta vp-limites">
    <h2 data-t="vp_limites_titulo">Lo que esta vista no ve</h2>
    <ul>
      <li data-t="vp_limite_contenido"></li>
      <li data-t="vp_limite_sni"></li>
      <li data-t="vp_limite_cert"></li>
      <li data-t="vp_limite_otros"></li>
      <li data-t="vp_limite_coste"></li>
    </ul>
  </section>
</div>
<details class="lente-tarjeta lente-mas"><summary data-t="lente_mas"></summary><div class="lente-mas-c"><p data-t="vp_intro"></p><p data-t="vp_sin_dns_que"></p><p data-t="vp_reenviado_que"></p></div></details>
</div>
<aside class="lente-lado">
  <div class="lente-significa">
    <span class="rotulo" data-t="lente_que_significa"></span>
    <p class="lente-s1" data-t="lente_vp_s1"></p>
    <p class="lente-s2" data-t="lente_vp_s2"></p>
    <div class="lente-sep"></div>
    <p class="lente-estado" hidden></p>
    <a class="boton principal lente-accion" href="#vp-programas" data-lente-abre="vp-programas" data-t="lente_vp_accion"></a>
  </div>
  <p class="lente-pie"></p>
</aside>
</div>
</main>
<script src="/static/lente.js"></script>

</html>
