<!doctype html>
<html lang="es" data-tierra="/static/tierra/">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>GUARDIANA · Órbita</title>
<link rel="stylesheet" href="/static/diseno.css">
<link rel="preload" href="/static/tierra/dia.jpg" as="image">
<link rel="stylesheet" href="/static/orbita.css">
</head>
<body>
<div id="escena" aria-hidden="true">
  <canvas id="estrellas"></canvas>
  <canvas id="tierra"></canvas>
  <canvas id="rutas"></canvas>
</div>
<div class="cruz v" aria-hidden="true"></div>
<div class="cruz h" aria-hidden="true"></div>
<svg id="anillo" class="geo" viewBox="-1 -1 2 2" aria-hidden="true"><circle r=".999" pathLength="1"></circle></svg>
<div id="anillo2" class="geo" aria-hidden="true"></div>
<div id="pulso" class="geo" aria-hidden="true"></div>

<header>
  <div class="izq">
    <button type="button" id="volver" class="boton chico" hidden><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>Órbita</button>
    <div class="marca">GUARDIANA</div>
    <div id="donde" class="donde" hidden></div>
  </div>
  <div id="estado" role="status">
    <span class="punto"></span><span>Vigilando este equipo y la casa</span>
    <span class="sep">·</span><span id="cuenta">Cortes en 24 h <b id="n">—</b></span>
    <span id="demo" class="demo" hidden>DEMOSTRACIÓN</span>
  </div>
  <div class="derecha">
    <span>ES</span>
    <a class="boton-icono" href="/estado" aria-label="Ajustes"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></a>
  </div>
</header>

<nav id="puertas" aria-label="Secciones"></nav>

<section id="ficha" aria-live="polite">
  <div class="cuerpo">
    <div class="k"><span id="ficha-n"></span><span class="de">/09</span><span class="sep">·</span><span id="ficha-k"></span></div>
    <div class="t" id="ficha-t"></div>
    <div class="d" id="ficha-d"></div>
  </div>
  <a class="abrir" id="ficha-a" href="#"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8h9M8.5 4l4 4-4 4"/></svg></a>
</section>

<aside id="directo" aria-label="En directo">
  <h2>EN DIRECTO</h2>
  <ul id="lista"></ul>
  <div id="espera">Esperando el primer corte. Cada uno aparecerá aquí y sobre el planeta.</div>
</aside>

<section id="seccion" aria-label="Sección">
  <iframe id="marco" title="Sección"></iframe>
  <div id="sin-pagina" class="sin-pagina" hidden>
    <div class="k" id="sp-k"></div>
    <h1 id="sp-t"></h1>
    <p id="sp-d"></p>
  </div>
</section>

<script src="/static/orbita.js"></script>
</body>
</html>
