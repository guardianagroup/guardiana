<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>GUARDIANA · Vigilancia</title>
<link rel="stylesheet" href="/static/diseno.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/lente.css">
<link rel="stylesheet" href="/static/vigilancia.css">
<link rel="preload" href="/static/fonts/HankenGrotesk-var.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="/static/fonts/SchibstedGrotesk-var.woff" as="font" type="font/woff" crossorigin>
<script src="/static/arranque.js"></script>
</head>
<body data-page="vigilancia">
<header class="top">
  <a class="brand" href="/" data-t-title="ir_inicio"><span class="brand-txt">GUARDIANA<small data-t="lema"></small></span></a>
  <nav>
    <a href="/por-dentro" data-t="menu_en_vivo">En vivo</a>
    <a href="/extracto" data-t="menu_actividad">Actividad</a>
    <a href="/contratos" data-t="nav_contratos">Contratos</a>
    <a href="/revision" aria-current="true" data-t="menu_diagnostico">Diagnóstico</a>
    <a href="/sabe-de-ti" data-t="menu_privacidad">Privacidad</a>
    <a href="/hogar" data-t="menu_ajustes">Ajustes</a>
  </nav>
</header>
<main class="lente vg" data-lente="vigilancia">
<div id="no-session" class="card hidden"><strong data-t="sin_sesion_titulo"></strong> <span data-t="sin_sesion_texto"></span></div>
<nav class="lente-miga" data-t-label="lente_miga"><a href="/revision" data-t="menu_diagnostico"></a><i aria-hidden="true"></i><span aria-current="page" data-t="nav_vigilancia"></span></nav>
<header class="lente-cabeza"><div><h1 data-t="nav_vigilancia"></h1><p class="lente-lead" data-t="lente_vg_lead"></p></div></header>
<section class="lente-cifras" aria-live="polite">
  <div class="lente-cifra"><b class="n"></b><span class="l" data-t="lente_vg_c1"></span></div>
  <div class="lente-cifra"><b class="n"></b><span class="l" data-t="lente_vg_c2"></span></div>
  <div class="lente-cifra"><b class="n"></b><span class="l" data-t="lente_vg_c3"></span></div>
  <div class="lente-cifra"><b class="n"></b><span class="l" data-t="lente_vg_c4"></span></div>
</section>
<div class="lente-cuerpo">
<div class="lente-principal">
<section class="tarjeta vg-cab" aria-live="polite">
  <div class="vg-cab-fila">
    <div id="vg-pastilla" class="vg-pastilla esperando"><i aria-hidden="true"></i><b id="vg-pastilla-texto"></b><span id="vg-pastilla-senal"></span></div>
    <button type="button" id="vg-ahora" class="boton chico lente-oculto" data-t="vg_comprobar_ahora">Comprobar ahora</button>
  </div>
  <p id="vg-ritmo" class="muted vg-ritmo"></p>
  <div class="vg-pulso">
    <div class="vg-pulso-cab"><span class="rotulo" data-t="vg_pulso_titulo">Pulso del día</span><span id="vg-hoy" class="muted"></span></div>
    <ol id="vg-horas" class="vg-horas" aria-hidden="true"></ol>
  </div>
</section>

<section id="vg-atencion" class="vg-atencion" hidden></section>
<section id="vg-avisos" class="vg-avisos" hidden>
  <h2 data-t="vg_avisos_titulo">Avisos nuevos</h2>
  <ul id="vg-avisos-lista" class="vg-lineas"></ul>
</section>

<div id="vg-rejilla" class="vg-rejilla"></div>

<section class="vg-historial">
  <div class="vg-historial-cab">
    <h2 data-t="vg_historial">Lo que ha visto</h2>
    <span id="vg-cadena" class="chip"></span>
  </div>
  <ul id="vg-historial" class="vg-lineas"></ul>
</section>

<details class="lente-tarjeta lente-mas"><summary data-t="lente_mas"></summary><div class="lente-mas-c"><p data-t="vg_intro"></p><p data-t="vg_pie"></p></div></details>
</div>
<aside class="lente-lado">
  <div class="lente-significa">
    <span class="rotulo" data-t="lente_que_significa"></span>
    <p class="lente-s1" data-t="lente_vg_s1"></p>
    <p class="lente-s2" data-t="lente_vg_s2"></p>
    <div class="lente-sep"></div>
    <p class="lente-estado" hidden></p>
    <a class="boton principal lente-accion" href="#" data-lente-pulsa="vg-ahora" data-t="lente_vg_ahora"></a>
  </div>
  <p class="lente-pie"></p>
</aside>
</div>
</main>
<script src="/static/lente.js"></script>
<script src="/static/vigilancia.js"></script>
<script src="/static/interruptor.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
