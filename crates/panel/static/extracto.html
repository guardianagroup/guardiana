<main class="lente" data-lente="extracto">
<div id="no-session" class="card hidden"><strong data-t="sin_sesion_titulo"></strong> <span data-t="sin_sesion_texto"></span></div>
<nav class="lente-miga" data-t-label="lente_miga"><a href="/extracto" data-t="menu_actividad"></a><i aria-hidden="true"></i><span aria-current="page" data-t="menu_registro"></span></nav>
<header class="lente-cabeza"><div><h1 data-t="menu_registro"></h1><p class="lente-lead" data-t="lente_registro_lead"></p></div></header>
<section class="lente-cifras" aria-live="polite">
  <div class="lente-cifra"><b class="n"></b><span class="l" data-t="lente_registro_c1"></span></div>
  <div class="lente-cifra"><b class="n"></b><span class="l" data-t="lente_registro_c2"></span></div>
  <div class="lente-cifra"><b class="n"></b><span class="l" data-t="lente_registro_c3"></span></div>
  <div class="lente-cifra"><b class="n"></b><span class="l" data-t="lente_registro_c4"></span></div>
</section>
<div class="lente-cuerpo">
<div class="lente-principal">
<section class="lente-tarjeta"><div class="lente-tc"><h2 data-t="lente_registro_filtrar"></h2></div><div class="lente-tb"><form id="filters" class="filters">
  <label><span data-t="f_dispositivo"></span><select name="device_id" id="f-device"><option value="" data-t="f_todas"></option></select></label>
  <label><span data-t="f_categoria"></span><select name="category"><option value="" data-t="f_todas"></option><option value="rastreador">rastreador</option><option value="publicidad">publicidad</option><option value="telemetria">telemetría</option><option value="esperado">normal</option><option value="desconocido">sin clasificar</option></select></label>
  <label><span data-t="f_senal"></span><select name="signal"><option value="" data-t="f_todas"></option><option value="baliza">baliza</option><option value="destino_nuevo">destino nuevo</option><option value="fuera_de_horas">fuera de horas</option><option value="evasion_dns">evasión de DNS</option><option value="volumen">volumen</option></select></label>
  <label><span data-t="f_veredicto"></span><select name="verdict"><option value="" data-t="f_todas"></option><option value="observado">observado</option><option value="respondido">permitido</option><option value="cortado">cortado</option></select></label>
  <label><span data-t="f_pais_servidor"></span><select name="pais" id="f-pais"><option value="" data-t="f_todas"></option></select></label>
  <label><span data-t="f_limite"></span><input name="limit" type="number" min="1" max="5000" value="200"></label>
  <button type="submit" data-t="filtrar"></button>
</form></div></section>
<section class="lente-tarjeta"><div class="lente-tc"><h2 data-t="cadena_titulo"></h2></div><div class="lente-tb"><p class="muted" data-t="cadena_lead"></p><p><button id="check" class="secondary" data-t="cadena_boton"></button> <span id="check-result" role="status" aria-live="polite"></span></p></div></section>
</div>
<aside class="lente-lado">
  <div class="lente-significa">
    <span class="rotulo" data-t="lente_que_significa"></span>
    <p class="lente-s1" data-t="lente_registro_s1"></p>
    <p class="lente-s2" data-t="lente_registro_s2"></p>
    <div class="lente-sep"></div>
    <p class="lente-estado" hidden></p>
    <a class="boton principal lente-accion" href="#" data-lente-pulsa="check" data-t="cadena_titulo"></a>
    <a class="boton lente-accion" href="#" data-lente-pulsa="export-csv" data-t="exportar_csv"></a>
  </div>
  <p class="lente-pie"></p>
</aside>
<div class="lente-completa">
<section class="lente-tarjeta"><div class="lente-tc"><h2 data-t="lente_registro_tabla"></h2><div class="lente-tc-der"><span class="muted" id="total"></span></div></div><div class="lente-tb sin-margen"><div class="lente-tabla"><table><thead><tr><th data-t="col_hora"></th><th data-t="col_nombre"></th><th data-t="col_empresa_n"></th><th data-t="col_categoria"></th><th data-t="col_pais"></th><th data-t="col_dispositivo"></th><th data-t="col_veredicto"></th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></section>
<p class="exportar"><a id="export-csv" class="btn secondary" href="#" data-t="exportar_csv"></a> <a id="export-json" class="btn secondary" href="#" data-t="exportar_json"></a> <button id="export-pdf" type="button" class="secondary" data-t="exportar_pdf"></button> <span id="export-pdf-msg" class="muted" role="status" aria-live="polite"></span></p>
<p class="limit fuente-red hidden" id="fuente-red"></p>
<div id="huecos-card" class="card hidden"><h2 data-t="huecos_titulo"></h2><ul id="huecos" class="muted"></ul></div>
<section class="lente-tarjeta"><div class="lente-tc"><h2 data-t="cambios_titulo"></h2></div><div class="lente-tb"><p class="muted" data-t="cambios_lead"></p><ul id="cambios" class="muted"></ul></div></section>
<details class="lente-tarjeta lente-mas"><summary data-t="lente_mas"></summary><div class="lente-mas-c"><p class="leyenda-colores" data-t-html="leyenda_colores"></p><p data-t="leyenda_desconocido"></p></div></details>
</div>
</div>
</main>
<footer><span data-t="pie"></span></footer>

</html>
