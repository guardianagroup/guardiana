<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Guardiana · Extracto</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="extracto">
<header class="top">
  <span class="brand">Guardiana</span> <span class="print-only" data-t="pdf_pie"></span>
  <nav>
    <a href="/"  data-t="nav_radiografia">Radiografía</a>
    <a href="/ia" data-t="nav_ia">Tu IA</a>
    <a href="/extracto" aria-current="page" data-t="nav_extracto">Extracto</a>
    <a href="/dispositivos"  data-t="nav_dispositivos">Dispositivos</a>
    <a href="/sabe-de-ti"  data-t="nav_sabe">Lo que Guardiana sabe de ti</a>
    <a href="/reglas" data-t="nav_reglas">Reglas</a>
    <a href="/informe" data-t="nav_informe">Informe semanal</a>
    <a href="/hogar" data-t="nav_hogar">Modo Hogar</a>
    <a href="/licencia" data-t="nav_licencia">Licencia</a>
    <a href="/verify" data-t="nav_verify">Verificar</a>
    <a href="/estado"  data-t="nav_estado">Estado</a>
  </nav>
</header>
<main>
<div id="no-session" class="card hidden"><strong data-t="sin_sesion_titulo"></strong> <span data-t="sin_sesion_texto"></span></div>
<h1 data-t="extracto_titulo"></h1>
<p class="lead" data-t="extracto_lead"></p>
<form id="filters" class="filters">
  <label><span data-t="f_dispositivo"></span><select name="device_id" id="f-device"><option value=""></option></select></label>
  <label><span data-t="f_categoria"></span><select name="category"><option value=""></option><option value="rastreador">rastreador</option><option value="publicidad">publicidad</option><option value="telemetria">telemetría</option><option value="esperado">esperado</option><option value="desconocido">desconocido</option></select></label>
  <label><span data-t="f_senal"></span><select name="signal"><option value=""></option><option value="baliza">baliza</option><option value="destino_nuevo">destino nuevo</option><option value="fuera_de_horas">fuera de horas</option><option value="evasion_dns">evasión de DNS</option><option value="volumen">volumen</option></select></label>
  <label><span data-t="f_veredicto"></span><select name="verdict"><option value=""></option><option value="observado">observado</option><option value="respondido">respondido</option><option value="cortado">cortado</option></select></label>
  <label><span data-t="f_limite"></span><input name="limit" type="number" min="1" max="5000" value="200"></label>
  <button type="submit" data-t="filtrar"></button>
</form>
<!-- Las tres formas de llevarse el extracto, juntas y en su propia fila: dentro del formulario
     de filtros se mezclaban con los desplegables y, al estrecharse la ventana, «Guardar en PDF»
     se iba solo a la línea de abajo (lo vio el responsable, 21 sep 2026). -->
<p class="exportar">
  <a id="export-csv" class="btn secondary" href="#" data-t="exportar_csv"></a>
  <a id="export-json" class="btn secondary" href="#" data-t="exportar_json"></a>
  <button id="export-pdf" type="button" class="secondary" data-t="exportar_pdf"></button>
  <span id="export-pdf-msg" class="muted"></span>
</p>
<p class="muted" id="total"></p>
<div class="card wrap"><table><thead><tr><th data-t="col_hora"></th><th data-t="col_nombre"></th><th data-t="col_empresa_n"></th><th data-t="col_categoria"></th><th data-t="col_pais"></th><th data-t="col_dispositivo"></th><th data-t="col_veredicto"></th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<h2 data-t="cadena_titulo"></h2>
<p class="lead" data-t="cadena_lead"></p>
<p><button id="check" class="secondary" data-t="cadena_boton"></button> <span id="check-result"></span></p>
<div id="huecos-card" class="card hidden"><h2 data-t="huecos_titulo"></h2><ul id="huecos" class="muted"></ul></div>
<div class="card"><h2 data-t="cambios_titulo"></h2><p class="lead" data-t="cambios_lead"></p><ul id="cambios" class="muted"></ul></div>
<p class="limit" data-t="leyenda_desconocido"></p>
</main>
<footer><span data-t="pie"></span></footer>
<script src="/static/app.js"></script>
</body>
</html>
