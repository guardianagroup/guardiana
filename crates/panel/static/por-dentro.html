<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>GUARDIANA · Por dentro</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="preload" href="/static/fonts/IBMPlexMono-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/tierra/dia.jpg" as="image">
<script src="/static/arranque.js"></script>
</head>
<body data-page="por-dentro" class="universo">
<div id="no-session" class="card hidden"><strong data-t="sin_sesion_titulo"></strong> <span data-t="sin_sesion_texto"></span></div>
<section class="stage" id="stage" aria-label="GUARDIANA por dentro">
  <div class="barra">
    <div class="marca"><a href="/" data-t="pd_volver">← Panel</a> <span data-t="pd_titulo">GUARDIANA por dentro</span> <span class="chip-modo corte" id="chip-modo" role="status" hidden></span></div>
    <div class="pestanas" role="group" data-t-label="pd_vistas">
      <button type="button" data-vista="destinos" aria-pressed="true"><span class="tecla" aria-hidden="true">1</span><span data-t="pd_vista_destinos">Destinos</span></button>
      <button type="button" data-vista="programas" aria-pressed="false"><span class="tecla" aria-hidden="true">2</span><span data-t="pd_vista_programas">Programas</span></button>
    </div>
    <div class="seg" id="filtro" role="group" data-t-label="pd_filtro">
      <button type="button" data-filtro="todo" aria-pressed="true" data-t="pd_filtro_todo">Todo</button><button type="button" data-filtro="datos" aria-pressed="false" data-t="pd_filtro_datos">Datos</button><button type="button" data-filtro="av" aria-pressed="false" data-t="pd_filtro_av">Antivirus</button>
    </div>
    <div class="controles">
      <span class="lugar-yo" title=""><span data-t="pd_tu_pais">Tu ordenador está en</span> <b id="yo"></b></span>
      <button type="button" class="btn-hud" id="precisar" data-t="pd_precisar">◎ Precisar</button>
      <button type="button" class="btn-hud" id="corregir-lugar" data-t="pd_corregir">Corregir ciudad</button>
      <span class="chip-vpn" id="vpn" hidden role="status"></span>
      <span class="en-vivo" role="status"><i aria-hidden="true"></i><span data-t="pd_en_vivo">En vivo</span></span>
      <button type="button" class="btn-hud graba" id="grabar" aria-pressed="false" data-t="pd_grabar">● Guardar 5 minutos de medidas</button>
      <button type="button" class="btn-hud" id="pantalla" data-t="pd_pantalla_completa">Pantalla completa</button>
    </div>
  </div>
  <div class="lienzo" id="lienzo">
    <canvas id="gl"></canvas>
    <canvas id="cv"></canvas>
    <div class="telemetria" id="telemetria" hidden></div>
    <aside class="datos" id="datos"><button type="button" class="cerrar-datos" id="cerrar-datos" data-t-label="pd_ocultar_cifras" aria-controls="datos">×</button><div id="datos-vivo"></div><p class="corte-av" id="corte-av" hidden><button type="button" class="btn-hud" id="corte-av-btn"></button></p><div id="datos-resto"></div></aside>
    <button type="button" class="abrir-datos" id="btn-datos" aria-controls="datos" hidden data-t="pd_ver_cifras">‹ Cifras</button>
    <div class="zoom" id="zoom" role="group" data-t-label="pd_zoom"><button type="button" id="zoom-mas" data-t-label="pd_zoom_mas">+</button><button type="button" id="zoom-menos" data-t-label="pd_zoom_menos">−</button><button type="button" id="zoom-0" data-t-label="pd_zoom_inicio">⌂</button></div>
    <div class="detalle" id="detalle" hidden role="dialog" aria-modal="false" data-t-label="pd_detalle"><button type="button" class="cerrar-datos" id="detalle-cerrar" data-t-label="pd_cerrar">×</button><div id="detalle-cuerpo"></div></div>
    <section class="explorador" id="explorador" hidden aria-labelledby="expl-t">
      <div class="ex-cab"><div><h2 id="expl-t" data-t="pd_ex_titulo">Actividad por programa</h2><p class="t" data-t="pd_ex_sub"></p></div><div class="ex-ind"><span id="expl-mayor"></span><span id="expl-ultima" class="t"></span></div></div>
      <div class="ex-herr"><label><span data-t="pd_ex_ordenar"></span> <select id="expl-orden"><option value="enviado" data-t="pd_ex_ord_env"></option><option value="recibido" data-t="pd_ex_ord_rec"></option><option value="ahora" data-t="pd_ex_ord_ahora"></option><option value="nombre" data-t="pd_ex_ord_nombre"></option></select></label><input type="search" id="expl-busca" autocomplete="off" spellcheck="false" data-t-label="pd_ex_buscar"></div>
      <div class="ex-cols t" aria-hidden="true"><span data-t="pd_ex_col_prog"></span><span data-t="pd_ex_col_destinos"></span><span data-t="pd_ex_col_env"></span><span data-t="pd_ex_col_rec"></span><span data-t="pd_ex_col_cortes"></span><span data-t="pd_ex_col_5min"></span><span></span></div>
      <div id="expl-filas"></div>
    </section>
    <div class="vigilancia-off" id="vigilancia-off" hidden><span data-t="pd_vigilancia_off"></span> <a href="/antivirus" data-t="pd_vigilancia_enciende"></a></div>
    <div class="leyenda" aria-hidden="true">
      <span><i class="ley-o"></i><span data-t="pd_ley_sale"></span></span>
      <span><i class="ley-i"></i><span data-t="pd_ley_entra"></span></span>
      <span><i class="ley-c"></i><span data-t="pd_ley_cortado"></span></span>
      <span><i class="ley-n"></i><span data-t="pd_ley_nodoc"></span></span>
    </div>
    <div class="ayuda-vista" id="ayuda-vista"></div>
    <div class="vacio" id="vacio" hidden role="status" aria-live="polite"><h2 id="vacio-titulo"></h2><p id="vacio-texto"></p><p id="vacio-enlace" hidden><a href="/" data-t="pd_ver_radiografia"></a></p></div>
    <div class="retrato" id="retrato" hidden role="dialog" aria-labelledby="retrato-t"><h2 id="retrato-t"></h2><p id="retrato-txt"></p><p class="pequeno" id="retrato-modo"></p><div class="aviso-botones"><button type="button" class="btn-hud" id="retrato-pdf" data-t="pd_retrato_pdf"></button><button type="button" class="btn-hud" id="retrato-csv" data-t="pd_retrato_csv"></button><button type="button" class="btn-hud" id="retrato-json" data-t="pd_retrato_json"></button><button type="button" class="btn-hud" id="retrato-cerrar" data-t="pd_retrato_cerrar"></button></div></div>
    <div class="tip" id="tip" hidden></div>
    <div class="aviso" id="aviso" hidden role="status" aria-live="polite"></div>
    <div class="ubicacion" id="ubicacion" hidden role="dialog" aria-modal="true" aria-labelledby="ubicacion-t">
      <h2 id="ubicacion-t" data-t="pd_corregir_titulo">Confirma tu ciudad</h2>
      <p data-t="pd_corregir_texto">Si el servicio de ubicación se equivoca, busca tu ciudad. La elección queda solo en este navegador.</p>
      <label for="ubicacion-busca" data-t="pd_corregir_etiqueta">Ciudad o región</label>
      <input id="ubicacion-busca" type="search" autocomplete="off" spellcheck="false" data-t-placeholder="pd_corregir_placeholder">
      <div class="ubicacion-resultados" id="ubicacion-resultados" role="listbox"></div>
      <div class="aviso-botones"><button type="button" class="btn-hud" id="ubicacion-cerrar" data-t="pd_corregir_cancelar">Cancelar</button></div>
    </div>
  </div>
  <div class="hud" id="hud">
    <button type="button" class="hud-asa" id="hud-asa" aria-expanded="false" aria-controls="hud" data-t-title="pd_hud_desplegar"><i aria-hidden="true"></i><span data-t="pd_hud_desplegar"></span></button>
    <div><h3><span data-t="pd_hud_registro" class="h3-titulo"></span> <span data-t="pd_hud_vivo"></span></h3><ul class="registro" id="registro"></ul></div>
    <div><h3><span data-t="pd_hud_enviado" class="h3-titulo"></span> <span id="hud-min"></span></h3><canvas id="spark"></canvas></div>
    <div><h3 data-t="pd_hud_paises"></h3><div class="barras" id="barras"></div></div>
    <div><h3 data-t="pd_hud_puertas"></h3><div class="grande" id="hud-cortes">0</div><div class="pequeno" id="hud-bloqueos"></div></div>
    <div><h3 data-t="pd_hud_top"></h3><ol class="top-ahora" id="hud-top"></ol></div>
  </div>
</section>
<script src="/static/por-dentro.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
