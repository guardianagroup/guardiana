<!doctype html>
<html lang="es">
<head>

<title>Guardiana · Lo que Guardiana sabe de ti</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="sabeDeTi">
<header class="top">
  <span class="brand">Guardiana</span>
  <nav>
    <a href="/"  data-t="nav_radiografia">Radiografía</a>
    <a href="/ia" data-t="nav_ia">Tu IA</a>

    <a href="/hogar" data-t="nav_hogar">Modo Hogar</a>

    <a href="/verify" data-t="nav_verify">Verificar</a>
    <a href="/estado"  data-t="nav_estado">Estado</a>
  </nav>
</header>
<main>
<div id="no-session" class="card hidden"><strong data-t="sin_sesion_titulo"></strong> <span data-t="sin_sesion_texto"></span></div>
<h1 data-t="sabe_titulo"></h1>
<p class="lead" data-t="sabe_lead"></p>
<div class="counters">
  <div class="counter"><div class="n" id="s-eventos">–</div><div class="l" data-t="s_eventos"></div></div>
  <div class="counter"><div class="n" id="s-dispositivos">–</div><div class="l" data-t="s_dispositivos"></div></div>
  <div class="counter"><div class="n" id="s-reglas">–</div><div class="l" data-t="s_reglas"></div></div>
  <div class="counter"><div class="n" id="s-nombres">–</div><div class="l" data-t="s_nombres"></div></div>
</div>
<div class="card"><p><span data-t="s_ruta"></span> <span class="mono" id="s-ruta"></span></p><p><span data-t="s_retencion"></span> <span id="s-retencion"></span></p><p class="muted" data-t="s_no_respuestas"></p></div>
<h2 data-t="outbound_titulo"></h2>
<p class="lead" data-t="outbound_lead"></p>
<div class="card wrap"><table><thead><tr><th data-t="col_fecha"></th><th data-t="col_motivo"></th><th data-t="col_host"></th><th data-t="col_bytes"></th></tr></thead><tbody id="outbound"></tbody></table></div>
<h2 data-t="borrar_titulo"></h2>
<p class="lead" data-t="borrar_lead"></p>
<p><button id="wipe" class="danger" data-t="borrar_boton"></button></p>
</main>
<footer><span data-t="pie"></span></footer>
<script src="/static/app.js"></script>
