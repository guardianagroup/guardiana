<p class="muted" id="i-periodo"></p>
<div class="card wrap"><table><thead><tr><th data-t="col_dispositivo"></th><th data-t="col_consultas"></th><th data-t="c_rastreadores"></th><th data-t="col_publicidad"></th><th data-t="col_telemetria"></th><th data-t="col_esperados"></th><th data-t="col_desconocidos"></th><th data-t="col_cortados"></th></tr></thead><tbody id="i-rows"></tbody><tfoot><tr id="i-total"></tr></tfoot></table></div>

<p><button id="i-pdf" type="button" class="secondary" data-t="exportar_pdf"></button> <span id="i-pdf-msg" class="muted"></span></p>

</div>
<p class="limit" data-t="informe_limite"></p>

<footer><span data-t="pie"></span></footer>
