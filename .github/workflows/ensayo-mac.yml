# Ensayo del paso del Mac antes de firmar de verdad (28 sep 2026). Dos trabajos:
#   pruebas:  que compile y pasen las pruebas en macOS;
#   publicar: build/publicar-1.0.0.sh con clave de usar y tirar (contraseña «ensayo»), hasta
#             donde se puede fuera del Mac: build/release.sh no corre en CI a propósito (protege
#             la clave de verdad), así que el ensayo termina ahí, y aparte se comprueba que la
#             contraseña escrita una vez contesta varias firmas seguidas. Solo lee de GitHub.
name: ensayo-mac
on:
  push:
    branches: ['ensayo-mac']
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  pruebas:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace --locked
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        # Las pruebas comprueban las frases en español; el Mac de GitHub viene en inglés (LANG).
        env:
          GUARDIANA_LANG: es
        run: cargo test --workspace --locked --no-fail-fast

  publicar:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: rsign, como en el Mac de publicación (sin Homebrew)
        run: |
          command -v minisign && echo "ojo: hay minisign" || echo "sin minisign, como el Mac"
          command -v expect
          cargo install rsign2 --locked
      - name: publicar-1.0.0.sh en modo ensayo, hasta release.sh
        env:
          ENSAYO: '1'
          DESCARGAS: /no/existe
          TRABAJO: ${{ runner.temp }}/trabajo
          REPO: /no/existe
        run: |
          bash build/publicar-1.0.0.sh < <(sleep 3600) 2>&1 | tee "$RUNNER_TEMP/salida.txt" || true
          grep -q '^Clave correcta' "$RUNNER_TEMP/salida.txt"
          grep -q 'never run in CI' "$RUNNER_TEMP/salida.txt"
      - name: la contraseña una vez contesta varias firmas
        env:
          GUARDIANA_CLAVE: ensayo
        run: |
          T="$RUNNER_TEMP/trabajo"
          for i in 1 2 3; do echo "archivo $i" > "$T/f$i"; done
          cat > "$T/tres-firmas.sh" <<'SH'
          set -e
          for i in 1 2 3; do rsign sign -s "$1/clave-ensayo/minisign.key" -x "$1/f$i.minisig" -t "f$i" "$1/f$i"; done
          SH
          expect -f "$T/con-clave.exp" -- bash "$T/tres-firmas.sh" "$T" < <(sleep 600)
          for i in 1 2 3; do rsign verify -p "$T/clave-ensayo/minisign.pub" -x "$T/f$i.minisig" "$T/f$i"; done
