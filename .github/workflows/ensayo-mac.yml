# Ensayo de 1.0.1 en un Mac de GitHub (28 sep 2026): compila y prueba, arma GUARDIANA.app con
# build/mac/crear-app.sh, y hace de verdad lo que hace el icono: instala el guardián con
# instalar.sh (el runner tiene sudo sin contraseña), comprueba DNS y panel, y lo quita con
# desinstalar.sh. Los diálogos no se pueden pulsar aquí; su AppleScript se compila con osacompile
# y las funciones del lanzador se prueban con lo que dice este Mac. No firma ni publica nada.
name: ensayo-mac
on:
  push:
    branches: ['ensayo-mac-*']
permissions:
  contents: read
  actions: read
env:
  CARGO_TERM_COLOR: always
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        env:
          GUARDIANA_LANG: es
        run: cargo test --workspace --locked --no-fail-fast
      - name: crear-app.sh
        run: |
          set -x
          # El icono sale de la web, como en publicar-*.sh (crear-app.sh lo busca en site/).
          mkdir -p site
          curl -fsSL https://raw.githubusercontent.com/guardianagroup/guardianagroup.com/main/icon-512.png -o site/icon-512.png
          build/mac/crear-app.sh "$RUNNER_TEMP/app"
          APP="$RUNNER_TEMP/app/GUARDIANA.app"
          v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          b=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")
          echo "Info.plist: $v ($b)"
          [ "$v" = "$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" ] && [ "$b" = "$v" ]
          plutil -lint "$APP/Contents/Info.plist"
          ls -l "$APP/Contents/MacOS" "$APP/Contents/Resources"
      - name: AppleScript de los diálogos compila
        run: |
          osacompile -o "$RUNNER_TEMP/say.scpt" -e 'on run argv' \
            -e 'display dialog (item 1 of argv) buttons {item 2 of argv} default button 1 with title "GUARDIANA" with icon (POSIX file (item 3 of argv))' -e 'end run'
          osacompile -o "$RUNNER_TEMP/ask.scpt" -e 'on run argv' \
            -e 'button returned of (display dialog (item 1 of argv) buttons {item 2 of argv, item 3 of argv} default button (item 3 of argv) with title "GUARDIANA" with icon (POSIX file (item 4 of argv)))' -e 'end run'
          osacompile -o "$RUNNER_TEMP/admin.scpt" -e 'on run argv' -e 'do shell script (item 1 of argv) with administrator privileges' -e 'end run'
          # Las mismas tres líneas que usa el lanzador, sacadas de él: si alguien las cambia allí
          # sin cambiar esto, que falle aquí.
          for s in 'display dialog (item 1 of argv) buttons {item 2 of argv} default button 1' \
                   'button returned of (display dialog (item 1 of argv) buttons {item 2 of argv, item 3 of argv}' \
                   'do shell script (item 1 of argv) with administrator privileges'; do
            grep -qF "$s" build/mac/lanzador.sh || { echo "el lanzador ya no dice: $s"; exit 1; }
          done
      - name: funciones del lanzador con lo que dice este Mac
        run: |
          eval "$(sed -n '/^idioma() {/,/^}/p;/^newer() {/,/^}/p;/^version_of() {/p' build/mac/lanzador.sh)"
          echo "AppleLanguages:"; defaults read -g AppleLanguages
          echo "idioma: $(idioma)"
          case "$(idioma)" in es|en|pt) ;; *) exit 1 ;; esac
          APP="$RUNNER_TEMP/app/GUARDIANA.app"
          echo "versión dentro de la app: $(version_of "$APP/Contents/Resources/guardiana")"
          newer 1.0.1 1.0.0 && ! newer 1.0.0 1.0.1 && ! newer 1.0.1 1.0.1 && newer 1.0.10 1.0.9
          # Otros idiomas del Mac
          for arr in '(\n    "de-DE"\n)' '(\n    "pt-BR",\n    en\n)' '(\n    "es-419"\n)' '(\n    en\n)'; do
            defaults() { printf "$arr\n"; }
            echo "$(printf "$arr" | tr '\n' ' ') -> $(idioma)"
          done
      - name: instalar, usar y quitar como lo hace el icono
        # Cada comprobación que falla deja una anotación con lo que se vio (las anotaciones se
        # leen sin permisos; el registro completo no).
        run: |
          set +e
          APP="$RUNNER_TEMP/app/GUARDIANA.app"
          RES="$APP/Contents/Resources"
          DATA="/Library/Application Support/Guardiana"
          fallos=0
          nota() { local t="$1"; shift; local m; m="$(printf '%s' "$*" | tail -c 3000 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"; echo "::error title=$t::$m"; fallos=$((fallos+1)); }
          aviso() { local t="$1"; shift; local m; m="$(printf '%s' "$*" | tail -c 3000 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"; echo "::warning title=$t::$m"; }
          aviso "antes: puerto 53" "$(sudo lsof -nP -iUDP:53 -iTCP:53 2>&1 | head -20)"
          aviso "antes: scutil" "$(scutil --dns | grep -m6 nameserver)"
          out=$(sudo "$RES/instalar.sh" "$RES/guardiana" "$USER" en 2>&1); rc=$?
          echo "$out"
          [ $rc = 0 ] && echo "$out" | tail -n 1 | grep -q '^Forwards to: ' || nota "instalar.sh (rc=$rc)" "$out"
          aviso "instalar.sh dijo" "$out"
          d=$(dig +short +time=3 +tries=2 @127.0.0.1 example.com 2>&1); echo "$d" | grep -qE '^[0-9]' || nota "dig 127.0.0.1" "$d"
          c=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7443/); [ "$c" = 200 ] || nota "panel" "http $c"
          tok=$(sudo cat "$DATA/panel.token" 2>&1 | tr -d '[:space:]'); [ ${#tok} = 64 ] || nota "token" "${#tok} caracteres"
          aviso "guardiana.log" "$(sudo tail -n 40 "$DATA/guardiana.log" 2>&1)"
          /usr/local/guardiana/guardiana --version || nota "version" "no responde"
          out=$(sudo "$RES/desinstalar.sh" pt 2>&1); rc=$?
          echo "$out"
          echo "$out" | tail -n 1 | grep -q '^O extrato continua em ' || nota "desinstalar.sh (rc=$rc)" "$out"
          [ -f /Library/LaunchDaemons/com.guardianagroup.guardiana.plist ] && nota "plist" "sigue ahí"
          [ -e /usr/local/guardiana ] && nota "binario" "sigue ahí"
          d=$(dig +short +time=2 +tries=1 @127.0.0.1 example.com 2>&1); echo "$d" | grep -qE '^[0-9]' && nota "tras quitar" "127.0.0.1:53 sigue contestando: $d"
          aviso "después: scutil" "$(scutil --dns | grep -m6 nameserver)"
          exit $fallos

  firmar:
    # firmar-1.0.1 (rama mac) como en el Mac de publicación, con los dos artefactos de la ejecución
    # que va a firmar puestos en «Descargas» y una clave de usar y tirar: hasta release.sh, que no
    # corre en CI a propósito.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          run-id: 36484545176
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/Downloads
      - name: rsign, como en el Mac de publicación
        run: cargo install rsign2 --locked
      - name: firmar-1.0.1 en modo ensayo
        env:
          ENSAYO: '1'
          DESCARGAS: ${{ runner.temp }}/Downloads
          TRABAJO: ${{ runner.temp }}/trabajo
        run: |
          ls -R "$DESCARGAS" | head -30
          git fetch -q origin mac
          git show FETCH_HEAD:firmar-1.0.1 > "$RUNNER_TEMP/firmar"
          set +e
          bash "$RUNNER_TEMP/firmar" < <(sleep 3600) > "$RUNNER_TEMP/salida.txt" 2>&1
          set -e
          cat "$RUNNER_TEMP/salida.txt"
          nota() { m="$(tail -c 3000 "$RUNNER_TEMP/salida.txt" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"; echo "::$1 title=$2::$m"; }
          if grep -q ': OK$' "$RUNNER_TEMP/salida.txt" && grep -q '^Clave correcta' "$RUNNER_TEMP/salida.txt" && grep -q 'never run in CI' "$RUNNER_TEMP/salida.txt"; then
            nota notice "firmar-1.0.1 llegó a release.sh"
          else
            nota error "firmar-1.0.1"
            exit 1
          fi
