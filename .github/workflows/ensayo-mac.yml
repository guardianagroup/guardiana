# Ensayo del paso del Mac antes de firmar de verdad (28 sep 2026). Dos cosas:
#   pruebas: que compile y pasen las pruebas en macOS;
#   publicar: build/publicar-1.0.0.sh entero, con clave de usar y tirar, Rekor de mentira y
#             sin subir nada. Solo lee de GitHub.
name: ensayo-mac
on:
  push:
    branches: ['ensayo-mac']
permissions:
  contents: read
  actions: read
env:
  CARGO_TERM_COLOR: always
jobs:
  pruebas:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace --locked
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        # Las pruebas comprueban las frases en español; el Mac de GitHub viene en inglés (LANG).
        env:
          GUARDIANA_LANG: es
        run: cargo test --workspace --locked --no-fail-fast

  publicar:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: guardiana-repro
          path: ${{ runner.temp }}/descargas/guardiana-repro
          run-id: 36447056747
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: guardiana-instaladores
          path: ${{ runner.temp }}/descargas/guardiana-instaladores
          run-id: 36447056747
          github-token: ${{ github.token }}
      - name: rsign, como en el Mac de publicación (sin Homebrew)
        run: |
          command -v minisign && echo "ojo: hay minisign" || echo "sin minisign, como el Mac"
          cargo install rsign2 --locked
      - name: publicar-1.0.0.sh en modo ensayo
        env:
          ENSAYO: '1'
          DESCARGAS: ${{ runner.temp }}/descargas
          TRABAJO: ${{ runner.temp }}/trabajo
          REPO: /no/existe
        run: bash build/publicar-1.0.0.sh
      - name: resultado
        if: always()
        run: |
          cd "$RUNNER_TEMP/trabajo" || exit 0
          ls -la archivos || true
          cat archivos/ledger-line.json || true
          grep -o 'macOS 13[^<]*' web/instalar.html || true
          grep -c 'descargas/1.0.0/' web/instalar.html web/en/install.html web/pt/instalar.html || true
          lipo -archs guardiana/build/out/app/GUARDIANA.app/Contents/Resources/guardiana || true
