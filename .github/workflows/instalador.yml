# Lo que ve una persona al instalar GUARDIANA en Windows, foto a foto (build/cliente/fotos_instalador.ps1).
#
# Dos máquinas nuevas: en una se instala la versión publicada desde cero; en la otra se actualiza desde la
# anterior con ZERO y sus avisos abiertos, como quien ya lo tiene. Cada una abre el instalador como un doble
# clic, pulsa lo que pulsaría una persona y deja en el registro las fotos distintas entre sí y cada ventana que
# apareció, aunque fuera un instante.
# Escrito el 2 Nov 2026 para la 1.0.54 (dueño: «una pantalla profesional mientras se está instalando… nada de
# tirón ni cosas raras»; y, a las 13:16, «primero me aparece la página de órbita y luego me aparece la que tiene
# que aparecer»).
# Desde el 3 nov 2026 cada caso sale bien solo si, sin pulsar nada al final, el instalador se cierra solo y se abre
# GUARDIANA (dueño: «hay que darle a la tecla finalizar, si no, no funciona… quiero que lo quites»); si no, el trabajo
# falla. Con «zero» (una ejecución de zero.yml) se prueba igual el instalador propio de GUARDIANA ZERO.
name: instalador

on:
  workflow_dispatch:
    inputs:
      candidato:
        description: 'Número de una ejecución de «candidato»: se prueba su instalador (desde cero, y actualizando desde lo publicado)'
        required: false
        default: ''
      zero:
        description: 'Número de una ejecución de «zero»: se prueba también el instalador propio de GUARDIANA ZERO (desde cero)'
        required: false
        default: ''
  push:
    branches: [antivirus-vpn]
    paths:
      - build/cliente/fotos_instalador.ps1
      - .github/workflows/instalador.yml

permissions:
  contents: read
  actions: read

jobs:
  fotos:
    name: fotos (${{ matrix.caso }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        caso: [nueva, actualiza]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: el instalador del candidato
        if: ${{ inputs.candidato != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidato-msi
          path: candidato
          run-id: ${{ inputs.candidato }}
          github-token: ${{ github.token }}
      - name: los instaladores publicados
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path inst | Out-Null
          $candidato = "${{ inputs.candidato }}"
          $pagina = (Invoke-WebRequest -UseBasicParsing https://guardianagroup.com/instalar.html).Content
          $v = [regex]::Match($pagina, '/descargas/([0-9.]+)/guardiana-[0-9.]+-windows-x64\.msi').Groups[1].Value
          if (-not $v) { throw "no encuentro la versión publicada en instalar.html" }
          Invoke-WebRequest -UseBasicParsing "https://guardianagroup.com/descargas/$v/guardiana-$v-windows-x64.msi" -OutFile "inst/nueva.msi"
          # A archivo y leído como texto: sin tipo de texto, .Content llega en bytes y la comparación no ve nada.
          Invoke-WebRequest -UseBasicParsing "https://guardianagroup.com/descargas/$v/SHA256SUMS" -OutFile "inst/SHA256SUMS"
          $sumas = Get-Content "inst/SHA256SUMS" -Raw
          $h = (Get-FileHash inst/nueva.msi -Algorithm SHA256).Hash.ToLower()
          if ($sumas -notmatch "$h\s+guardiana-$v-windows-x64\.msi") { throw "la huella de la $v no es la publicada" }
          Write-Output "publicada: $v · $h"
          if ($candidato) {
            # el candidato es «la nueva»; al actualizar, «la de antes» es la publicada (lo que tiene la gente hoy)
            Move-Item inst/nueva.msi inst/antes.msi
            $m = Get-ChildItem candidato -Filter "guardiana-*-windows-x64.msi" | Select-Object -First 1
            if (-not $m) { throw "el candidato $candidato no trae el MSI en español" }
            Copy-Item $m.FullName inst/nueva.msi
            Write-Output "candidato: $($m.Name) · $((Get-FileHash inst/nueva.msi -Algorithm SHA256).Hash.ToLower())"
          } elseif ("${{ matrix.caso }}" -eq "actualiza") {
            # La anterior, de la historia de la web (la 1.0.52, retirada al publicar la 1.0.53), con la huella que se publicó.
            git clone --quiet --filter=blob:none --no-checkout https://github.com/guardianagroup/guardianagroup.com web
            cmd /c "git -C web show a08bd3600202a7c45142a75012c83cac792c9644:descargas/1.0.52/guardiana-1.0.52-windows-x64.msi > inst\antes.msi"
            $h = (Get-FileHash inst/antes.msi -Algorithm SHA256).Hash.ToLower()
            if ($h -ne "bc1d2a802f954a7a26614667fed44d2054765807b14ce401c98b222d26d1c900") { throw "la huella de la 1.0.52 no es la publicada: $h" }
            Write-Output "anterior: 1.0.52 · $h"
          }
      - name: instalar como una persona, foto a foto
        shell: powershell
        run: |
          # -Antes solo si hay versión de antes: Windows PowerShell no pasa un argumento vacío (y el script se paraba sin hacer nada)
          $argumentos = @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "build/cliente/fotos_instalador.ps1", "-Instalador", (Resolve-Path inst/nueva.msi).Path, "-Nombre", "${{ matrix.caso }}")
          if ("${{ matrix.caso }}" -eq "actualiza") { $argumentos += @("-Antes", (Resolve-Path inst/antes.msi).Path) }
          & powershell @argumentos
          exit $LASTEXITCODE

  zero:
    name: fotos (instalador de GUARDIANA ZERO)
    if: ${{ inputs.zero != '' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: el instalador de ZERO de esa ejecución
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: guardiana-zero-windows
          path: zero-msi
          run-id: ${{ inputs.zero }}
          github-token: ${{ github.token }}
      - name: instalar como una persona, foto a foto
        shell: powershell
        run: |
          # el de español (los otros dos terminan en -en.msi y -pt.msi)
          $m = Get-ChildItem zero-msi -Filter "guardiana-zero-*-windows-x64.msi" | Select-Object -First 1
          if (-not $m) { throw "la ejecución ${{ inputs.zero }} de zero no trae el instalador en español" }
          Write-Output "ZERO: $($m.Name) · $((Get-FileHash $m.FullName -Algorithm SHA256).Hash.ToLower())"
          & powershell -NoProfile -ExecutionPolicy Bypass -File build/cliente/fotos_instalador.ps1 -Instalador $m.FullName -Nombre zero
          exit $LASTEXITCODE
