# The VPN's adapter on a real Windows (in preparation; docs/VPN.md, owner, 1 Nov 2026, 17:35: «sigue trabajando en la
# VPN y en el antivirus»). The signed wireguard.dll exactly as WireGuard LLC publishes it (download.wireguard.com), its
# Authenticode signature checked before anything loads it, and crates/apps/src/wireguard_nt.rs's real test: an adapter
# created, configured with crates/tunel/src/nt.rs's bytes, brought up and down, and closed. And corte_vpn.rs's: every
# permit filter of the cut-off switch accepted by Windows, in a dynamic session closed at once (the blocking ones are
# left out, so the runner's own network is never cut, but for the block on what Windows forwards, which the runner does
# not use: 1.0.56). GitHub's Windows runners run as administrators.
# And the antivirus cuts' (crates/panel/src/antivirus.rs, reviews of vpn-1055b, arreglos-1055 and arreglos-1056): a panel
# rebuilt while the old one's state is still alive keeps the cuts in Windows' filter engine, once the old state is gone
# too; a let-through goes through with a filter already gone; putting a cut back with fewer paths keeps the earlier ones;
# a path with no file is skipped and cut when the file appears, and a kept one is forgotten only after a day without it,
# not at two starts in a row; another session opened first takes nothing with it; a session Windows lost is opened again
# with its cuts, by the minute's look too, and one it still has gets back in itself the filters it lost; a cut that
# cannot be put back is not lost (empty files of the tests' own are what is cut, and they are let through).
# And, on Linux, the VPN end to end: GUARDIANA's server (crates/tunel-servidor) with the kernel's WireGuard in one network
# namespace, a computer's side of the sign-up (crates/tunel/examples/alta_prueba.rs) in another, the post-quantum
# preshared key derived on both sides, and traffic through the tunnel. Test keys only, made and thrown away here.
# CI never holds signing keys and never publishes anything (brief §10).
name: vpn

on:
  push:
    branches: ['**']
    paths:
      - 'crates/tunel/**'
      - 'crates/tunel-servidor/**'
      - 'crates/apps/src/wireguard_nt.rs'
      - 'crates/apps/src/corte_vpn.rs'
      - 'crates/apps/src/red_vpn.rs'
      - 'crates/apps/src/tunel_win.rs'
      - 'crates/apps/src/cortafuegos.rs'
      - 'crates/apps/src/cortafuegos/**'
      - 'crates/panel/src/antivirus.rs'
      - 'crates/panel/src/vpn.rs'
      - 'crates/cli/src/vpn_cmd.rs'
      - 'crates/apps/Cargo.toml'
      - '.github/workflows/vpn.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  adaptador:
    name: WireGuardNT en Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: wireguard.dll firmada por WireGuard LLC
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wireguard-nt.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'wireguard-nt'
          Invoke-WebRequest -Uri 'https://download.wireguard.com/wireguard-nt/wireguard-nt-1.1.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $dll = Get-ChildItem -Path $dir -Recurse -Filter wireguard.dll | Where-Object { $_.FullName -match '\\amd64\\' } | Select-Object -First 1
          if (-not $dll) { Write-Output '::error title=wireguard.dll::no está en el .zip (bin\amd64)'; exit 1 }
          $firma = Get-AuthenticodeSignature -FilePath $dll.FullName
          $quien = if ($firma.SignerCertificate) { $firma.SignerCertificate.Subject } else { '' }
          $huella = (Get-FileHash -Path $dll.FullName -Algorithm SHA256).Hash
          Write-Output "firma: $($firma.Status) · $quien"
          Write-Output "sha256: $huella"
          # the 1.1 build seen on 1 Nov 2026 (docs/VPN.md): another one is a new build to look at before trusting it
          if ($huella -ne 'B1B85E072C45D81358BE29D94C599DC76652F912BE8C0F0A41E2D5D89A6461D3') {
            Write-Output "::error title=wireguard.dll::otra compilación ($huella): revisarla antes de usarla"
            exit 1
          }
          if ($firma.Status -ne 'Valid' -or $quien -notmatch 'WireGuard LLC') {
            Write-Output "::error title=wireguard.dll::firma no válida o de otro firmante ($($firma.Status), $quien)"
            exit 1
          }
          "GUARDIANA_WG_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: la prueba real del adaptador
        shell: bash
        run: |
          set -o pipefail
          # one at a time: the tunnel's resolver and strict mode's objects in Windows are the whole process's and the
          # whole computer's
          cargo test -p guardiana-apps --locked -- --ignored --nocapture --test-threads=1 wireguard_nt corte_vpn red_vpn tunel_win 2>&1 | tee "$RUNNER_TEMP/test.log" && exit 0
          grep -E "^test .* FAILED$|panicked at|^---- " "$RUNNER_TEMP/test.log" | head -20 | while IFS= read -r l; do echo "::error title=adaptador::$l"; done
          grep -A12 "panicked at" "$RUNNER_TEMP/test.log" | head -40 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/^/::error title=detalle::/'; echo
          exit 1

  cortes:
    name: los cortes del antivirus en Windows, al rehacer el panel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: la prueba real de los cortes
        shell: bash
        run: |
          set -o pipefail
          r=0
          # one at a time: they share the process's cuts, as the panels of one service do
          cargo test -p guardiana-panel --lib --locked -- --ignored --nocapture --test-threads=1 antivirus::en_windows 2>&1 | tee "$RUNNER_TEMP/test.log" || r=$?
          # a filter that matched nothing would pass without having checked anything
          if [ "$r" = "0" ] && grep -qE "test result: ok\. [1-9][0-9]* passed" "$RUNNER_TEMP/test.log"; then exit 0; fi
          [ "$r" = "0" ] && echo "::error title=cortes::la prueba no corrió"
          grep -E "^test .* FAILED$|panicked at|^---- " "$RUNNER_TEMP/test.log" | head -20 | while IFS= read -r l; do echo "::error title=cortes::$l"; done
          grep -A12 "panicked at" "$RUNNER_TEMP/test.log" | head -40 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/^/::error title=detalle::/'; echo
          exit 1

  # Strict mode (ronda 91; docs/VPN.md, «Modo estricto»), with GUARDIANA's real service on this runner, as an
  # administrator, and a server that never answers (192.0.2.1, a documentation address: a black hole). What is kept says
  # the VPN is on in strict mode; the service, at its start, puts the block and keeps trying. Then: nothing leaves by
  # the network card (Windows refuses a TCP connection, WSAEACCES) and the panel says «reconectando» with the notice;
  # the service killed, and then stopped as an update stops it: the block stays (persistent filters, outliving the
  # process); «Desconectar» (POST /api/vpn/desconecta) takes it all away and the network is back; a block left with
  # strict mode off in what is kept is removed by the service's start; and `guardiana vpn apaga`, with the service
  # stopped, removes it too. The block on what Windows forwards (ICS, the mobile hotspot, WinNAT; 1.0.56) is read in
  # Windows' own list (netsh wfp show state), in both forwarding layers, and counted filter by filter by `guardiana vpn
  # estado` (2 persistent and 2 boot-time), through the service's death and stop, and gone with each way out. Review of
  # the 1.0.56 VPN: the service starts after Windows' filtering service (BFE), also one registered before without it; the
  # panel says when «Desconectar» is needed and what of «what a website sees» was really measured; and with wireguard.dll
  # gone, the start does not put the block again, the panel says why, and «Desconectar» still takes away the block left.
  # The runner's network is cut for those moments (its link with GitHub may pause), and whatever happens, the last step
  # takes the block and the service away.
  estricto:
    name: el modo estricto con el servicio de verdad y un servidor que no contesta
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: wireguard.dll firmada por WireGuard LLC
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wireguard-nt.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'wireguard-nt'
          Invoke-WebRequest -Uri 'https://download.wireguard.com/wireguard-nt/wireguard-nt-1.1.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $dll = Get-ChildItem -Path $dir -Recurse -Filter wireguard.dll | Where-Object { $_.FullName -match '\\amd64\\' } | Select-Object -First 1
          if (-not $dll) { Write-Output '::error title=wireguard.dll::no está en el .zip (bin\amd64)'; exit 1 }
          $huella = (Get-FileHash -Path $dll.FullName -Algorithm SHA256).Hash
          $firma = Get-AuthenticodeSignature -FilePath $dll.FullName
          $quien = if ($firma.SignerCertificate) { $firma.SignerCertificate.Subject } else { '' }
          if ($huella -ne 'B1B85E072C45D81358BE29D94C599DC76652F912BE8C0F0A41E2D5D89A6461D3' -or $firma.Status -ne 'Valid' -or $quien -notmatch 'WireGuard LLC') {
            Write-Output "::error title=wireguard.dll::otra compilación o firma no válida ($huella, $($firma.Status), $quien)"
            exit 1
          }
          "GUARDIANA_WG_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # Built before anything is cut.
      - name: compilar guardiana.exe
        run: cargo build -p guardiana-cli --locked
      - name: el servicio, su bloqueo y sus salidas
        timeout-minutes: 20
        shell: pwsh
        run: |
          $g = Join-Path $env:GITHUB_WORKSPACE 'target\debug\guardiana.exe'
          Copy-Item $env:GUARDIANA_WG_DLL (Join-Path (Split-Path $g) 'wireguard.dll') -Force
          $datos = Join-Path $env:ProgramData 'Guardiana'
          $deseo = Join-Path $datos 'sistema\vpn.json'
          $fallos = New-Object System.Collections.Generic.List[string]
          $inicio = Get-Date
          function Linea($t) { Write-Output ("[{0,6:N1} s] {1}" -f ((Get-Date) - $inicio).TotalSeconds, $t) }
          function Bien($ok, $que) { if ($ok) { Linea "BIEN $que" } else { Linea "MAL  $que"; $fallos.Add($que) } }
          function Estado { & $g vpn estado --json | Out-String | ConvertFrom-Json }
          # a TCP connection to the internet: «conecta», «cortada» (Windows refused it: WSAEACCES, the filter) or what failed
          function Fuera {
            $c = New-Object System.Net.Sockets.TcpClient
            try {
              $t = $c.ConnectAsync('1.1.1.1', 443)
              if ($t.Wait(5000) -and $c.Connected) { 'conecta' } else { 'sin respuesta' }
            } catch {
              $e = $_.Exception
              while ($e.InnerException) { $e = $e.InnerException }
              if ($e -is [System.Net.Sockets.SocketException] -and $e.ErrorCode -eq 10013) { 'cortada' } else { $e.Message }
            } finally { $c.Dispose() }
          }
          function Espera($segundos, [scriptblock]$si) {
            $hasta = (Get-Date).AddSeconds($segundos)
            while ((Get-Date) -lt $hasta) { if (& $si) { return $true }; Start-Sleep -Milliseconds 500 }
            return $false
          }
          function Panel($metodo, $ruta) {
            $llave = (Get-Content (Join-Path $datos 'panel.token') -Raw).Trim()
            Invoke-RestMethod -Method $metodo -Uri "http://127.0.0.1:7443$ruta" -Headers @{ 'X-Guardiana-Token' = $llave; 'X-Guardiana-Lang' = 'es' } -TimeoutSec 60
          }
          function Pon($estricto, $encendida) {
            New-Item -ItemType Directory -Force -Path (Split-Path $deseo) | Out-Null
            [ordered]@{ estricto = $estricto; encendida = $encendida; servidor = 'prueba.guardianagroup.com'; alta = '192.0.2.1:443'; punto = 'prueba.guardianagroup.com'; extremo = '192.0.2.1:51820' } | ConvertTo-Json | Set-Content -Path $deseo -Encoding utf8
          }
          function Para { & $g service stop | Out-Null; Espera 60 { (Get-Service guardiana).Status -eq 'Stopped' } }
          function Arranca { & $g service start | Out-Null; Espera 60 { (Get-Service guardiana).Status -eq 'Running' } }
          function Bloqueado { $e = Estado; $e.persistentes -gt 0 }
          function Limpio { $e = Estado; $e.persistentes -eq 0 -and $e.arranque -eq 0 -and -not $e.objetos }
          # the service starts after Windows' filtering service (BFE)
          function Depende { (& sc.exe qc guardiana | Out-String) -match 'DEPENDENCIES\s*:\s*BFE' }
          # Windows' filters as XML: its whole filtering state (netsh wfp show state; the file holds more than one
          # document, so they go under one root) or, if that cannot be read, `netsh wfp show filters verbose=on`, which of
          # the forwarding layers lists only the boot-time filters (5 Nov 2026: ours and the firewall's «Boot Time Filter»,
          # not the persistent ones).
          function ListaWfp {
            $s = Join-Path $env:RUNNER_TEMP 'estado-wfp.xml'
            Remove-Item $s -ErrorAction SilentlyContinue
            netsh wfp show state file="$s" | Out-Null
            try {
              $t = (Get-Content -Path $s -Raw -ErrorAction Stop) -replace '<\?xml[^>]*\?>', ''
              $x = New-Object System.Xml.XmlDocument
              $x.LoadXml("<raiz>$t</raiz>")
              return @{ xml = $x; de = 'show state' }
            } catch { Write-Host "  sin el estado de WFP ($_): la lista de filtros" }
            $f = Join-Path $env:RUNNER_TEMP 'filtros-wfp.xml'
            Remove-Item $f -ErrorAction SilentlyContinue
            netsh wfp show filters file="$f" verbose=on | Out-Null
            try {
              $x = New-Object System.Xml.XmlDocument
              $x.Load($f)
              return @{ xml = $x; de = 'show filters' }
            } catch { Write-Host "  sin la lista de filtros: $_"; return $null }
          }
          # GUARDIANA's filters in the forwarding layers (FWPM_LAYER_IPFORWARD_V4 and _V6) as Windows lists them: how many in
          # each layer, how many persistent and boot-time, and how many others there. -Detalle names the others and gives
          # the weight of each sublayer with filters there (strict mode's is 0xFFFF), for the record.
          function Reenvio([switch]$Detalle) {
            $n = [ordered]@{ v4 = 0; v6 = 0; persistentes = 0; arranque = 0; otros = 0; de = '' }
            $l = ListaWfp
            if (-not $l) { return [pscustomobject]$n }
            $n.de = $l.de
            $capas = @{ 'FWPM_LAYER_IPFORWARD_V4' = 'v4'; '{a82acc24-4ee1-4ee1-b465-fd1d25cb10a4}' = 'v4'; 'FWPM_LAYER_IPFORWARD_V6' = 'v6'; '{7b964818-19c7-493a-b71f-832c3684d28c}' = 'v6' }
            $subcapas = @{}
            foreach ($i in $l.xml.SelectNodes('//item[filterKey]')) {
              $k = $i.SelectSingleNode('layerKey')
              if (-not $k) { $k = $i.SelectSingleNode('ancestor::item[layer][1]/layer/layerKey') }
              $capa = $capas["$($k.InnerText)".Trim()]
              if (-not $capa) { continue }
              $sub = "$($i.SelectSingleNode('subLayerKey').InnerText)".Trim()
              $subcapas[$sub.ToLower()] = $true
              $nombre = "$($i.SelectSingleNode('displayData/name').InnerText)"
              if (-not $nombre.StartsWith('GUARDIANA VPN')) {
                $n.otros++
                if ($Detalle) { Write-Host "  otro filtro en la capa de reenvío ${capa}: «$nombre», $($i.SelectSingleNode('action/type').InnerText), subcapa $sub" }
                continue
              }
              $n[$capa]++
              $marcas = "$($i.SelectSingleNode('flags').InnerText)"
              if ($marcas -match 'PERSISTENT') { $n.persistentes++ }
              if ($marcas -match 'BOOTTIME') { $n.arranque++ }
            }
            if ($Detalle) {
              foreach ($i in $l.xml.SelectNodes('//item[subLayerKey and weight and not(filterKey)]')) {
                $sub = "$($i.SelectSingleNode('subLayerKey').InnerText)".Trim()
                if ($subcapas.ContainsKey($sub.ToLower())) { Write-Host "  subcapa con filtros de reenvío: «$($i.SelectSingleNode('displayData/name').InnerText)» $sub, peso $($i.SelectSingleNode('weight').InnerText)" }
              }
            }
            [pscustomobject]$n
          }
          function SinReenvio { $r = Reenvio; $r.de -ne '' -and $r.v4 -eq 0 -and $r.v6 -eq 0 }
          try {
            Bien ((Fuera) -eq 'conecta') 'antes, la red sale'
            # 1. the VPN on in strict mode, with a server that never answers: the service's start puts the block
            Pon $true $true
            & $g service install | Out-Null
            Bien (Depende) 'el servicio depende del servicio de filtrado de Windows (BFE)'
            Bien (Espera 60 { Bloqueado }) 'al arrancar, el servicio pone el bloqueo del modo estricto'
            Linea "estado: $(Estado | ConvertTo-Json -Compress)"
            Bien ((Estado).arranque -gt 0) 'con sus filtros de arranque'
            $r = Reenvio -Detalle
            Linea "capas de reenvío en la lista de Windows: $($r | ConvertTo-Json -Compress)"
            Bien ($r.v4 -ge 1 -and $r.v6 -ge 1) 'el bloqueo de lo que Windows reenvía, en la lista de Windows, en sus dos capas de reenvío (IPv4 e IPv6)'
            Bien ((Estado).reenvio -eq 4) 'y Windows, filtro a filtro: 4 en las capas de reenvío (persistente y de arranque, en cada una)'
            Bien ((Fuera) -eq 'cortada') 'con el servidor sin contestar, nada sale por la tarjeta (WSAEACCES)'
            Bien (Espera 90 { try { (Panel 'GET' '/api/vpn').fase -eq 'reconectando' } catch { $false } }) 'el panel dice «reconectando»'
            $v = Panel 'GET' '/api/vpn'
            Linea "GET /api/vpn: $($v | ConvertTo-Json -Compress)"
            Bien ($v.estricto -eq $true -and $v.bloqueado -eq $true -and "$($v.aviso)".StartsWith('La VPN no conecta')) 'con el modo estricto, el bloqueo y el aviso'
            Bien ($v.desconectar -eq $true) 'y «Desconectar» a la vista'
            $c = Panel 'GET' '/api/vpn/comprueba'
            Linea "GET /api/vpn/comprueba: $($c | ConvertTo-Json -Compress)"
            Bien ($null -ne $c.comprobado -and $c.comprobado.ip -eq $false -and $c.comprobado.dns -eq $false -and $c.comprobado.ipv6 -eq $false) 'lo que una web verá: nada dado por medido con el bloqueo puesto'
            # 2. the service killed: the block stays, and Windows starts it again
            $proceso = (Get-CimInstance Win32_Service -Filter "Name='guardiana'").ProcessId
            Stop-Process -Id $proceso -Force
            Start-Sleep -Seconds 2
            Bien (Bloqueado) 'el servicio muerto: el bloqueo sigue'
            Bien ((Fuera) -eq 'cortada') 'el servicio muerto: nada sale'
            $r = Reenvio
            Bien ($r.v4 -ge 1 -and $r.v6 -ge 1 -and (Estado).reenvio -eq 4) "el servicio muerto: el bloqueo de lo reenviado sigue ($($r | ConvertTo-Json -Compress))"
            Bien (Espera 90 { (Get-Service guardiana).Status -eq 'Running' }) 'Windows vuelve a arrancar el servicio'
            # 3. stopped, as an update stops it: the block stays
            Bien (Para) 'parado'
            Bien (Bloqueado) 'parado (una actualización): el bloqueo sigue'
            Bien ((Fuera) -eq 'cortada') 'parado: nada sale'
            $r = Reenvio
            Bien ($r.v4 -ge 1 -and $r.v6 -ge 1 -and (Estado).reenvio -eq 4) "parado: el bloqueo de lo reenviado sigue ($($r | ConvertTo-Json -Compress))"
            # 4. «Desconectar»: everything goes, the normal connection is back. Before, a service registered without BFE
            # (as an older installer did) gets it at its start
            & sc.exe config guardiana depend= / | Out-Null
            Bien (-not (Depende)) 'un servicio de antes, sin depender de BFE'
            Bien (Arranca) 'arrancado otra vez'
            Bien (Espera 30 { Depende }) 'al arrancar, el servicio vuelve a depender de BFE'
            Bien (Espera 60 { try { $null -ne (Panel 'GET' '/api/vpn').fase } catch { $false } }) 'el panel contesta'
            $r = Panel 'POST' '/api/vpn/desconecta'
            Bien ($r.ok -eq $true) "Desconectar: $($r | ConvertTo-Json -Compress)"
            Bien (Limpio) 'Desconectar quita el bloqueo entero'
            Bien (SinReenvio) 'Desconectar quita también el bloqueo de lo reenviado (en la lista de Windows)'
            Bien (-not (Estado).encendida) 'y la VPN queda apagada en lo guardado'
            Bien (Espera 30 { (Fuera) -eq 'conecta' }) 'tras Desconectar, la red sale otra vez'
            # 5. a block left behind and strict mode off in what is kept: the service's start removes it
            Pon $true $true
            Bien ((Para) -and (Arranca) -and (Espera 60 { Bloqueado })) 'otra vez el bloqueo'
            Bien ((Para) -and (Bloqueado)) 'con el servicio parado, el bloqueo queda'
            Pon $false $true
            Bien (Arranca) 'arrancado con el modo estricto apagado'
            Bien (Espera 60 { Limpio }) 'al arrancar, el servicio quita lo que quedó del modo estricto'
            Bien (SinReenvio) 'también el bloqueo de lo reenviado'
            Bien (Espera 30 { (Fuera) -eq 'conecta' }) 'y la red sale'
            # 6. `guardiana vpn apaga` with the service stopped
            Pon $true $true
            Bien ((Para) -and (Arranca) -and (Espera 60 { Bloqueado })) 'otra vez el bloqueo'
            Bien ((Para) -and (Bloqueado)) 'con el servicio parado, el bloqueo queda'
            & $g vpn apaga
            Bien ($LASTEXITCODE -eq 0) 'guardiana vpn apaga termina bien'
            Bien (Limpio) 'guardiana vpn apaga, con el servicio parado, lo quita todo'
            Bien (SinReenvio) 'también el bloqueo de lo reenviado'
            Bien (-not (Estado).encendida) 'y deja la VPN apagada en lo guardado'
            Bien (Espera 30 { (Fuera) -eq 'conecta' }) 'y la red sale'
            # 7. without wireguard.dll the VPN cannot come back: the start does not put the block again, the panel says
            # why and shows «Desconectar», which takes away the block left from before
            Pon $true $true
            Bien ((Arranca) -and (Espera 60 { Bloqueado })) 'otra vez el bloqueo'
            Bien ((Para) -and (Bloqueado)) 'con el servicio parado, el bloqueo queda'
            $dll = Join-Path (Split-Path $g) 'wireguard.dll'
            Move-Item $dll "$dll.aparte" -Force
            try {
              Bien (Arranca) 'arrancado sin wireguard.dll'
              Bien (Espera 60 { try { (Panel 'GET' '/api/vpn').fase -eq 'error' } catch { $false } }) 'sin wireguard.dll, el panel dice «error»'
              $v = Panel 'GET' '/api/vpn'
              Linea "GET /api/vpn: $($v | ConvertTo-Json -Compress)"
              Bien ($v.disponible -eq $false -and $v.desconectar -eq $true -and "$($v.error)".Contains('wireguard.dll')) 'con el motivo y «Desconectar»'
              Bien ((Bloqueado) -and (Fuera) -eq 'cortada') 'el bloqueo de antes sigue, y nada sale'
              $r = Panel 'POST' '/api/vpn/desconecta'
              Bien ($r.ok -eq $true) "Desconectar sin wireguard.dll: $($r | ConvertTo-Json -Compress)"
              Bien (Limpio) 'y quita el bloqueo entero'
              Bien (Espera 30 { (Fuera) -eq 'conecta' }) 'y la red sale'
            } finally {
              Move-Item "$dll.aparte" $dll -Force
            }
          } finally {
            & $g vpn apaga | Out-Null
            & $g service uninstall | Out-Null
          }
          if ($fallos.Count -gt 0) {
            foreach ($f in $fallos) { Write-Output "::error title=modo estricto::$f" }
            exit 1
          }
          Write-Output "::notice title=modo estricto::todas las comprobaciones, bien"
      - name: lo que quede, fuera (siempre)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $g = Join-Path $env:GITHUB_WORKSPACE 'target\debug\guardiana.exe'
          if (Test-Path $g) {
            & $g vpn apaga
            & $g service uninstall
            & $g vpn estado --json
          }

  extremo:
    name: la VPN de extremo a extremo en Linux (alta postcuántica y túnel de verdad)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: el servidor y el lado del equipo
        run: |
          cargo build --release --locked -p guardiana-tunel-servidor --bin guardiana-tunel-servidor
          cargo build --release --locked -p guardiana-tunel --example alta_prueba
      - name: WireGuard del núcleo y sus herramientas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools
      - name: el alta y el túnel, en dos redes aparte unidas por un cable virtual
        run: |
          set -eux
          sudo ip netns add srv
          sudo ip netns add cli
          sudo ip link add v-srv type veth peer name v-cli
          sudo ip link set v-srv netns srv
          sudo ip link set v-cli netns cli
          sudo ip -n srv addr add 192.168.77.1/24 dev v-srv
          sudo ip -n cli addr add 192.168.77.2/24 dev v-cli
          for n in srv cli; do sudo ip -n "$n" link set lo up; done
          sudo ip -n srv link set v-srv up
          sudo ip -n cli link set v-cli up
          # the server: its WireGuard (10.66.0.1, the tunnel's network) and GUARDIANA's sign-up service
          umask 077
          wg genkey > "$RUNNER_TEMP/srv.key"
          sudo ip -n srv link add wg0 type wireguard
          sudo ip netns exec srv wg set wg0 private-key "$RUNNER_TEMP/srv.key" listen-port 51820
          sudo ip -n srv addr add 10.66.0.1/16 dev wg0
          sudo ip -n srv link set wg0 up
          sudo ip netns exec srv ./target/release/guardiana-tunel-servidor --punto prueba.guardianagroup.com:51820 --interfaz wg0 --escucha 192.168.77.1:8793 > "$RUNNER_TEMP/servidor.log" 2>&1 &
          for i in $(seq 1 50); do sudo ip netns exec cli bash -c 'exec 3<>/dev/tcp/192.168.77.1/8793' 2>/dev/null && break; sleep 0.2; done
          # the computer: the sign-up, and WireGuard with what it answered (the server's address instead of its name)
          sudo ip netns exec cli ./target/release/examples/alta_prueba http://192.168.77.1:8793/vpn/alta > "$RUNNER_TEMP/cli.ini"
          direccion=$(grep '^Address = ' "$RUNNER_TEMP/cli.ini" | cut -d' ' -f3)
          grep -v -E '^(Address|DNS|MTU) = ' "$RUNNER_TEMP/cli.ini" | sed -E 's#^Endpoint = .*#Endpoint = 192.168.77.1:51820#; s#^AllowedIPs = .*#AllowedIPs = 10.66.0.0/16#' > "$RUNNER_TEMP/cli.conf"
          sudo ip -n cli link add wg0 type wireguard
          sudo ip netns exec cli wg setconf wg0 "$RUNNER_TEMP/cli.conf"
          sudo ip -n cli addr add "$direccion" dev wg0
          sudo ip -n cli link set wg0 up
          sudo ip -n cli route add 10.66.0.0/16 dev wg0
          # traffic through the tunnel: only if both sides derived the same preshared key
          sudo ip netns exec cli ping -c 3 -W 3 10.66.0.1
          sudo ip netns exec srv wg show wg0 latest-handshakes | awk '$2 > 0 { ok = 1 } END { exit !ok }'
          sudo ip netns exec srv wg show wg0 preshared-keys | awk '$2 != "(none)" { ok = 1 } END { exit !ok }'
          echo "::notice title=vpn::alta postcuántica, saludo de WireGuard y tráfico por el túnel ($direccion → 10.66.0.1)"
      - name: lo que dijo el servidor
        if: always()
        run: cat "$RUNNER_TEMP/servidor.log" || true

  # The first real connection (docs/VPN.md, «Pendiente» 3): only when launched by hand (gh workflow run vpn.yml), never
  # on a push. crates/apps/examples/vpn_de_verdad.rs connects this runner to vpn.guardianagroup.com with everything inside
  # the tunnel and the cut-off switch on, checks through the tunnel (the tunnel's resolver answers, the public address
  # is the server's) and outside it (the gateway, and a public resolver asked from the network card, are cut before they
  # leave), disconnects and checks the network is back. Safe for the runner: `conecta` closes the tunnel and its switch
  # when the server does not answer in 8 s; the program closes them on every path and a watchdog does it at 150 s; and
  # the switch is a dynamic WFP session and the adapter belongs to the process, so both go with it if it dies. While the
  # tunnel is up the runner's own traffic goes through it too (or nowhere): its link with GitHub may pause for that
  # minute.
  de_verdad:
    name: la primera conexión de verdad, con el corte puesto (solo a mano)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: wireguard.dll firmada por WireGuard LLC
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wireguard-nt.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'wireguard-nt'
          Invoke-WebRequest -Uri 'https://download.wireguard.com/wireguard-nt/wireguard-nt-1.1.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $dll = Get-ChildItem -Path $dir -Recurse -Filter wireguard.dll | Where-Object { $_.FullName -match '\\amd64\\' } | Select-Object -First 1
          if (-not $dll) { Write-Output '::error title=wireguard.dll::no está en el .zip (bin\amd64)'; exit 1 }
          $firma = Get-AuthenticodeSignature -FilePath $dll.FullName
          $quien = if ($firma.SignerCertificate) { $firma.SignerCertificate.Subject } else { '' }
          $huella = (Get-FileHash -Path $dll.FullName -Algorithm SHA256).Hash
          Write-Output "firma: $($firma.Status) · $quien"
          Write-Output "sha256: $huella"
          if ($huella -ne 'B1B85E072C45D81358BE29D94C599DC76652F912BE8C0F0A41E2D5D89A6461D3') {
            Write-Output "::error title=wireguard.dll::otra compilación ($huella): revisarla antes de usarla"
            exit 1
          }
          if ($firma.Status -ne 'Valid' -or $quien -notmatch 'WireGuard LLC') {
            Write-Output "::error title=wireguard.dll::firma no válida o de otro firmante ($($firma.Status), $quien)"
            exit 1
          }
          "GUARDIANA_WG_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # Built before connecting: with the switch on, nothing is fetched outside the tunnel.
      - name: compilar el programa de la prueba
        run: cargo build -p guardiana-apps --example vpn_de_verdad --locked
      - name: la red del equipo, antes
        continue-on-error: true
        shell: pwsh
        run: |
          Get-NetIPConfiguration | Format-List InterfaceAlias, IPv4Address, IPv4DefaultGateway, DNSServer
          Get-NetRoute -AddressFamily IPv4 -DestinationPrefix '0.0.0.0/0' | Format-Table InterfaceAlias, NextHop, RouteMetric -AutoSize
          Resolve-DnsName vpn.guardianagroup.com -Type A -ErrorAction SilentlyContinue | Format-Table Name, Type, IPAddress -AutoSize
      # What the Filtering Platform blocks, in Windows' own record (Security events 5157 and 5152; GUIDs from
      # learn.microsoft.com, «WFP auditing and logging»): a UDP datagram it drops tells the program nothing, so the check
      # reads it there (the first run, 3 Nov 2026, had no answer and no WSAEACCES for the DNS queries from the card).
      - name: que Windows anote lo que corta el Filtering Platform
        shell: cmd
        run: |
          auditpol /set /subcategory:"{0CCE9226-69AE-11D9-BED3-505054503030}" /failure:enable || exit /b 1
          auditpol /set /subcategory:"{0CCE9225-69AE-11D9-BED3-505054503030}" /failure:enable || exit /b 1
          auditpol /get /subcategory:"{0CCE9226-69AE-11D9-BED3-505054503030},{0CCE9225-69AE-11D9-BED3-505054503030}"
      - name: conectar, comprobar y desconectar
        timeout-minutes: 8
        shell: pwsh
        env:
          GUARDIANA_VPN_SERVIDOR: vpn.guardianagroup.com
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'target\debug\examples\vpn_de_verdad.exe')
          $codigo = $LASTEXITCODE
          if ($codigo -ne 0) { Write-Output "::error title=vpn de verdad::el programa terminó con $codigo (lo que falló está en el registro de este paso)" }
          exit $codigo
      - name: la red del equipo, después (siempre)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Get-NetAdapter -IncludeHidden | Format-Table Name, Status, InterfaceDescription -AutoSize
          Get-NetRoute -AddressFamily IPv4 -DestinationPrefix '0.0.0.0/0' | Format-Table InterfaceAlias, NextHop, RouteMetric -AutoSize
          Resolve-DnsName github.com -Type A -ErrorAction SilentlyContinue | Select-Object -First 2 | Format-Table Name, IPAddress -AutoSize
          try { "dirección pública: " + (Invoke-RestMethod -Uri 'https://api.ipify.org' -TimeoutSec 15) } catch { "sin dirección pública: $_" }

  # Strict mode against the real servers, with GUARDIANA's real service (docs/VPN.md, «El modo estricto» and «Las
  # salidas»): only when launched by hand (gh workflow run vpn.yml), never on a push. «estricto» above has the real
  # service with a server that never answers, and «de_verdad» the real server in normal mode; here both together,
  # through the panel's API as the page does it (build/vpn/estricto_de_verdad.ps1): strict mode on and Helsinki (the
  # tunnel up, the block in Windows, HTTPS out, the public address an echo sees is the server's and not the runner's,
  # nothing out by the network card); Nuremberg and Miami, only when their sign-up answers from outside at the start
  # (otherwise «salida no disponible, se omite», not a failure), and back to Helsinki; the service's process killed
  # (taskkill /F) with the tunnel up: nothing out (WSAEACCES) while it is dead, also with only the persistent block (the
  # test takes the boot-time filters out, as they are once Windows' filtering service has loaded the persistent ones
  # after a restart), and once started again it reconnects by itself; «Desconectar»: the runner's own address back and
  # nothing of GUARDIANA left in the Filtering Platform (netsh wfp show filters and show state) nor kept for the next
  # start (BFE's policy in the registry); and `guardiana vpn apaga --menu` (the Start menu's «Apagar la VPN de
  # GUARDIANA»), with the service stopped and the block on. Every check prints BIEN or MAL. Safe for the runner: a
  # watchdog with a time limit per phase (build/vpn/vigilante_vpn.ps1) turns the VPN off, takes the block out of Windows
  # and stops the service; each moment without network is short (the longest, the service dead, ~20 s; with the tunnel
  # up the runner's traffic goes through it); and the last step, whatever happens, leaves the network as it was and
  # shows it.
  estricto_de_verdad:
    name: el modo estricto con el servicio de verdad y los servidores de verdad (solo a mano)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # launched by hand, and a failed run is the one launched again: its build is kept anyway
          cache-on-failure: true
      - name: wireguard.dll firmada por WireGuard LLC
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wireguard-nt.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'wireguard-nt'
          Invoke-WebRequest -Uri 'https://download.wireguard.com/wireguard-nt/wireguard-nt-1.1.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $dll = Get-ChildItem -Path $dir -Recurse -Filter wireguard.dll | Where-Object { $_.FullName -match '\\amd64\\' } | Select-Object -First 1
          if (-not $dll) { Write-Output '::error title=wireguard.dll::no está en el .zip (bin\amd64)'; exit 1 }
          $huella = (Get-FileHash -Path $dll.FullName -Algorithm SHA256).Hash
          $firma = Get-AuthenticodeSignature -FilePath $dll.FullName
          $quien = if ($firma.SignerCertificate) { $firma.SignerCertificate.Subject } else { '' }
          Write-Output "firma: $($firma.Status) · $quien"
          Write-Output "sha256: $huella"
          if ($huella -ne 'B1B85E072C45D81358BE29D94C599DC76652F912BE8C0F0A41E2D5D89A6461D3' -or $firma.Status -ne 'Valid' -or $quien -notmatch 'WireGuard LLC') {
            Write-Output "::error title=wireguard.dll::otra compilación o firma no válida ($huella, $($firma.Status), $quien)"
            exit 1
          }
          "GUARDIANA_WG_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # Built before anything is cut.
      - name: compilar guardiana.exe
        run: cargo build -p guardiana-cli --locked
      - name: el modo estricto, conectado de verdad
        timeout-minutes: 15
        shell: pwsh
        run: |
          $g = Join-Path $env:GITHUB_WORKSPACE 'target\debug\guardiana.exe'
          Copy-Item $env:GUARDIANA_WG_DLL (Join-Path (Split-Path $g) 'wireguard.dll') -Force
          & ./build/vpn/estricto_de_verdad.ps1 -Exe $g -Trabajo (Join-Path $env:RUNNER_TEMP 'estricto-de-verdad')
          exit $LASTEXITCODE
      - name: la red como estaba, y lo que quede (siempre)
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $g = Join-Path $env:GITHUB_WORKSPACE 'target\debug\guardiana.exe'
          $trabajo = Join-Path $env:RUNNER_TEMP 'estricto-de-verdad'
          # the watchdog, told to end, and ended if it is still there
          New-Item -ItemType Directory -Force -Path $trabajo | Out-Null
          Set-Content -LiteralPath (Join-Path $trabajo 'fin.txt') -Value 'fin'
          Get-CimInstance Win32_Process -Filter "Name='pwsh.exe'" | Where-Object { $_.CommandLine -like '*vigilante_vpn.ps1*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          if (Test-Path $g) {
            & $g vpn apaga
            & $g service uninstall
            & $g vpn estado --json
          }
          $vigilante = Join-Path $trabajo 'vigilante.log'
          if (Test-Path $vigilante) { Get-Content $vigilante | ForEach-Object { "vigilante: $_" } }
          Get-NetAdapter -IncludeHidden | Format-Table Name, Status, InterfaceDescription -AutoSize
          Get-NetRoute -AddressFamily IPv4 -DestinationPrefix '0.0.0.0/0' | Format-Table InterfaceAlias, NextHop, RouteMetric -AutoSize
          Get-DnsClientServerAddress -AddressFamily IPv4 | Where-Object { $_.ServerAddresses } | Format-Table InterfaceAlias, ServerAddresses -AutoSize
          $filtros = Join-Path $env:RUNNER_TEMP 'filtros-al-final.xml'
          netsh wfp show filters "file=$filtros" | Out-Null
          if (Test-Path $filtros) { "filtros con nombre de GUARDIANA en Windows: $(([regex]::Matches((Get-Content -Raw $filtros), '<name>GUARDIANA[^<]*</name>')).Count)" }
          try { "dirección pública: " + (Invoke-RestMethod -Uri 'https://api.ipify.org' -TimeoutSec 15) } catch { "sin dirección pública: $_" }
      # What netsh showed at each moment (show filters and show state), and the watchdog's log, to look at afterwards.
      - name: lo que vio netsh, para mirarlo después (siempre)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: estricto-de-verdad
          path: ${{ runner.temp }}/estricto-de-verdad/
          retention-days: 7
          if-no-files-found: ignore
