# The VPN's adapter on a real Windows (in preparation; docs/VPN.md, owner, 1 Nov 2026, 17:35: «sigue trabajando en la
# VPN y en el antivirus»). The signed wireguard.dll exactly as WireGuard LLC publishes it (download.wireguard.com), its
# Authenticode signature checked before anything loads it, and crates/apps/src/wireguard_nt.rs's real test: an adapter
# created, configured with crates/tunel/src/nt.rs's bytes, brought up and down, and closed. And corte_vpn.rs's: every
# permit filter of the cut-off switch accepted by Windows, in a dynamic session closed at once (the blocking ones are
# left out, so the runner's own network is never cut). GitHub's Windows runners run as administrators.
# And, on Linux, the VPN end to end: GUARDIANA's server (crates/tunel-servidor) with the kernel's WireGuard in one network
# namespace, a computer's side of the sign-up (crates/tunel/examples/alta_prueba.rs) in another, the post-quantum
# preshared key derived on both sides, and traffic through the tunnel. Test keys only, made and thrown away here.
# CI never holds signing keys and never publishes anything (brief §10).
name: vpn

on:
  push:
    branches: ['**']
    paths:
      - 'crates/tunel/**'
      - 'crates/tunel-servidor/**'
      - 'crates/apps/src/wireguard_nt.rs'
      - 'crates/apps/src/corte_vpn.rs'
      - 'crates/apps/src/red_vpn.rs'
      - 'crates/apps/src/tunel_win.rs'
      - 'crates/apps/Cargo.toml'
      - '.github/workflows/vpn.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  adaptador:
    name: WireGuardNT en Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: wireguard.dll firmada por WireGuard LLC
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wireguard-nt.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'wireguard-nt'
          Invoke-WebRequest -Uri 'https://download.wireguard.com/wireguard-nt/wireguard-nt-1.1.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $dll = Get-ChildItem -Path $dir -Recurse -Filter wireguard.dll | Where-Object { $_.FullName -match '\\amd64\\' } | Select-Object -First 1
          if (-not $dll) { Write-Output '::error title=wireguard.dll::no está en el .zip (bin\amd64)'; exit 1 }
          $firma = Get-AuthenticodeSignature -FilePath $dll.FullName
          $quien = if ($firma.SignerCertificate) { $firma.SignerCertificate.Subject } else { '' }
          $huella = (Get-FileHash -Path $dll.FullName -Algorithm SHA256).Hash
          Write-Output "firma: $($firma.Status) · $quien"
          Write-Output "sha256: $huella"
          # the 1.1 build seen on 1 Nov 2026 (docs/VPN.md): another one is a new build to look at before trusting it
          if ($huella -ne 'B1B85E072C45D81358BE29D94C599DC76652F912BE8C0F0A41E2D5D89A6461D3') {
            Write-Output "::error title=wireguard.dll::otra compilación ($huella): revisarla antes de usarla"
            exit 1
          }
          if ($firma.Status -ne 'Valid' -or $quien -notmatch 'WireGuard LLC') {
            Write-Output "::error title=wireguard.dll::firma no válida o de otro firmante ($($firma.Status), $quien)"
            exit 1
          }
          "GUARDIANA_WG_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: la prueba real del adaptador
        shell: bash
        run: |
          set -o pipefail
          cargo test -p guardiana-apps --locked -- --ignored --nocapture wireguard_nt corte_vpn red_vpn tunel_win 2>&1 | tee "$RUNNER_TEMP/test.log" && exit 0
          grep -E "^test .* FAILED$|panicked at|^---- " "$RUNNER_TEMP/test.log" | head -20 | while IFS= read -r l; do echo "::error title=adaptador::$l"; done
          grep -A12 "panicked at" "$RUNNER_TEMP/test.log" | head -40 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/^/::error title=detalle::/'; echo
          exit 1

  extremo:
    name: la VPN de extremo a extremo en Linux (alta postcuántica y túnel de verdad)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: el servidor y el lado del equipo
        run: |
          cargo build --release --locked -p guardiana-tunel-servidor --bin guardiana-tunel-servidor
          cargo build --release --locked -p guardiana-tunel --example alta_prueba
      - name: WireGuard del núcleo y sus herramientas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools
      - name: el alta y el túnel, en dos redes aparte unidas por un cable virtual
        run: |
          set -eux
          sudo ip netns add srv
          sudo ip netns add cli
          sudo ip link add v-srv type veth peer name v-cli
          sudo ip link set v-srv netns srv
          sudo ip link set v-cli netns cli
          sudo ip -n srv addr add 192.168.77.1/24 dev v-srv
          sudo ip -n cli addr add 192.168.77.2/24 dev v-cli
          for n in srv cli; do sudo ip -n "$n" link set lo up; done
          sudo ip -n srv link set v-srv up
          sudo ip -n cli link set v-cli up
          # the server: its WireGuard (10.66.0.1, the tunnel's network) and GUARDIANA's sign-up service
          umask 077
          wg genkey > "$RUNNER_TEMP/srv.key"
          sudo ip -n srv link add wg0 type wireguard
          sudo ip netns exec srv wg set wg0 private-key "$RUNNER_TEMP/srv.key" listen-port 51820
          sudo ip -n srv addr add 10.66.0.1/16 dev wg0
          sudo ip -n srv link set wg0 up
          sudo ip netns exec srv ./target/release/guardiana-tunel-servidor --punto prueba.guardianagroup.com:51820 --interfaz wg0 --escucha 192.168.77.1:8793 > "$RUNNER_TEMP/servidor.log" 2>&1 &
          for i in $(seq 1 50); do sudo ip netns exec cli bash -c 'exec 3<>/dev/tcp/192.168.77.1/8793' 2>/dev/null && break; sleep 0.2; done
          # the computer: the sign-up, and WireGuard with what it answered (the server's address instead of its name)
          sudo ip netns exec cli ./target/release/examples/alta_prueba http://192.168.77.1:8793/vpn/alta > "$RUNNER_TEMP/cli.ini"
          direccion=$(grep '^Address = ' "$RUNNER_TEMP/cli.ini" | cut -d' ' -f3)
          grep -v -E '^(Address|DNS|MTU) = ' "$RUNNER_TEMP/cli.ini" | sed -E 's#^Endpoint = .*#Endpoint = 192.168.77.1:51820#; s#^AllowedIPs = .*#AllowedIPs = 10.66.0.0/16#' > "$RUNNER_TEMP/cli.conf"
          sudo ip -n cli link add wg0 type wireguard
          sudo ip netns exec cli wg setconf wg0 "$RUNNER_TEMP/cli.conf"
          sudo ip -n cli addr add "$direccion" dev wg0
          sudo ip -n cli link set wg0 up
          sudo ip -n cli route add 10.66.0.0/16 dev wg0
          # traffic through the tunnel: only if both sides derived the same preshared key
          sudo ip netns exec cli ping -c 3 -W 3 10.66.0.1
          sudo ip netns exec srv wg show wg0 latest-handshakes | awk '$2 > 0 { ok = 1 } END { exit !ok }'
          sudo ip netns exec srv wg show wg0 preshared-keys | awk '$2 != "(none)" { ok = 1 } END { exit !ok }'
          echo "::notice title=vpn::alta postcuántica, saludo de WireGuard y tráfico por el túnel ($direccion → 10.66.0.1)"
      - name: lo que dijo el servidor
        if: always()
        run: cat "$RUNNER_TEMP/servidor.log" || true

  # The first real connection (docs/VPN.md, «Pendiente» 3): only when launched by hand (gh workflow run vpn.yml), never
  # on a push. crates/apps/examples/vpn_de_verdad.rs connects this runner to vpn.guardianagroup.com with everything inside
  # the tunnel and the cut-off switch on, checks through the tunnel (the tunnel's resolver answers, the public address
  # is the server's) and outside it (the gateway, and a public resolver asked from the network card, are cut before they
  # leave), disconnects and checks the network is back. Safe for the runner: `conecta` closes the tunnel and its switch
  # when the server does not answer in 8 s; the program closes them on every path and a watchdog does it at 150 s; and
  # the switch is a dynamic WFP session and the adapter belongs to the process, so both go with it if it dies. While the
  # tunnel is up the runner's own traffic goes through it too (or nowhere): its link with GitHub may pause for that
  # minute.
  de_verdad:
    name: la primera conexión de verdad, con el corte puesto (solo a mano)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: wireguard.dll firmada por WireGuard LLC
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wireguard-nt.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'wireguard-nt'
          Invoke-WebRequest -Uri 'https://download.wireguard.com/wireguard-nt/wireguard-nt-1.1.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $dll = Get-ChildItem -Path $dir -Recurse -Filter wireguard.dll | Where-Object { $_.FullName -match '\\amd64\\' } | Select-Object -First 1
          if (-not $dll) { Write-Output '::error title=wireguard.dll::no está en el .zip (bin\amd64)'; exit 1 }
          $firma = Get-AuthenticodeSignature -FilePath $dll.FullName
          $quien = if ($firma.SignerCertificate) { $firma.SignerCertificate.Subject } else { '' }
          $huella = (Get-FileHash -Path $dll.FullName -Algorithm SHA256).Hash
          Write-Output "firma: $($firma.Status) · $quien"
          Write-Output "sha256: $huella"
          if ($huella -ne 'B1B85E072C45D81358BE29D94C599DC76652F912BE8C0F0A41E2D5D89A6461D3') {
            Write-Output "::error title=wireguard.dll::otra compilación ($huella): revisarla antes de usarla"
            exit 1
          }
          if ($firma.Status -ne 'Valid' -or $quien -notmatch 'WireGuard LLC') {
            Write-Output "::error title=wireguard.dll::firma no válida o de otro firmante ($($firma.Status), $quien)"
            exit 1
          }
          "GUARDIANA_WG_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # Built before connecting: with the switch on, nothing is fetched outside the tunnel.
      - name: compilar el programa de la prueba
        run: cargo build -p guardiana-apps --example vpn_de_verdad --locked
      - name: la red del equipo, antes
        continue-on-error: true
        shell: pwsh
        run: |
          Get-NetIPConfiguration | Format-List InterfaceAlias, IPv4Address, IPv4DefaultGateway, DNSServer
          Get-NetRoute -AddressFamily IPv4 -DestinationPrefix '0.0.0.0/0' | Format-Table InterfaceAlias, NextHop, RouteMetric -AutoSize
          Resolve-DnsName vpn.guardianagroup.com -Type A -ErrorAction SilentlyContinue | Format-Table Name, Type, IPAddress -AutoSize
      # What the Filtering Platform blocks, in Windows' own record (Security events 5157 and 5152; GUIDs from
      # learn.microsoft.com, «WFP auditing and logging»): a UDP datagram it drops tells the program nothing, so the check
      # reads it there (the first run, 3 Nov 2026, had no answer and no WSAEACCES for the DNS queries from the card).
      - name: que Windows anote lo que corta el Filtering Platform
        shell: cmd
        run: |
          auditpol /set /subcategory:"{0CCE9226-69AE-11D9-BED3-505054503030}" /failure:enable || exit /b 1
          auditpol /set /subcategory:"{0CCE9225-69AE-11D9-BED3-505054503030}" /failure:enable || exit /b 1
          auditpol /get /subcategory:"{0CCE9226-69AE-11D9-BED3-505054503030},{0CCE9225-69AE-11D9-BED3-505054503030}"
      - name: conectar, comprobar y desconectar
        timeout-minutes: 8
        shell: pwsh
        env:
          GUARDIANA_VPN_SERVIDOR: vpn.guardianagroup.com
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'target\debug\examples\vpn_de_verdad.exe')
          $codigo = $LASTEXITCODE
          if ($codigo -ne 0) { Write-Output "::error title=vpn de verdad::el programa terminó con $codigo (lo que falló está en el registro de este paso)" }
          exit $codigo
      - name: la red del equipo, después (siempre)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Get-NetAdapter -IncludeHidden | Format-Table Name, Status, InterfaceDescription -AutoSize
          Get-NetRoute -AddressFamily IPv4 -DestinationPrefix '0.0.0.0/0' | Format-Table InterfaceAlias, NextHop, RouteMetric -AutoSize
          Resolve-DnsName github.com -Type A -ErrorAction SilentlyContinue | Select-Object -First 2 | Format-Table Name, IPAddress -AutoSize
          try { "dirección pública: " + (Invoke-RestMethod -Uri 'https://api.ipify.org' -TimeoutSec 15) } catch { "sin dirección pública: $_" }
