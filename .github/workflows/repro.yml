# Reproducible build (brief §10) on a machine that is not ours.
#
# The release Mac has no Docker and cannot install it (no Homebrew, no admin), so until today
# build/repro.sh could not run anywhere: the site promised "anyone can compile this and get the
# same hash" and nobody had ever checked it. A GitHub runner has Docker, starts from nothing every
# time and is not our machine, which is exactly what makes its answer worth something.
#
# It signs nothing and publishes nothing: the private key never comes near CI (brief §10). It only
# builds and prints the hashes, which is the half that can be automated.
name: repro

on:
  workflow_dispatch:
  push:
    tags: ['v*', 'repro-*']
    # A branch with the same name works too: from some machines a tag cannot be pushed, and
    # the build that anyone can repeat must not depend on which machine asks for it.
    branches: ['repro-*']

permissions:
  contents: read

jobs:
  hashes:
    name: SHA-256 of the Linux and Windows binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # repro.sh reads the commit date with git show
      - name: reproducible build
        run: build/repro.sh HEAD
      - name: the hashes
        # Also as notices: they show on the run page and through the public API without signing
        # in, so the release Mac can be given the expected hashes without anyone opening a log.
        run: |
          cat build/out/SHA256SUMS
          while read -r h n; do echo "::notice title=${n#\*}::$h"; done < build/out/SHA256SUMS
      - name: build twice and compare
        # Reproducible means the same input gives the same output, so the only honest check is to
        # do it again and compare. If these two differ, the word does not apply and the release
        # must not be published.
        run: |
          cp build/out/SHA256SUMS /tmp/primera
          build/repro.sh HEAD
          diff -u /tmp/primera build/out/SHA256SUMS && echo "the two builds match"
      - uses: actions/upload-artifact@v4
        with:
          name: guardiana-repro
          path: |
            build/out/SHA256SUMS
            build/out/guardiana-*
          retention-days: 14

  instaladores:
    # The three Windows installers, built from the very .exe the job above produced and
    # compared twice, on a Windows machine that is not ours (28 Sep 2026). Until then they were
    # built by hand on the test PC and carried to the Mac, which is one more place where the
    # "same .exe" promise could quietly break. Signs nothing: the minisign signature is made on
    # the release machine by build/release.sh, the only place the private key exists.
    name: Windows installers (es, en, pt)
    needs: hashes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: guardiana-repro
          path: build/out
      - name: WiX 5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: three installers from the reproducible .exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $exe = "build/out/guardiana-$version-windows-x86_64.exe"
          New-Item -ItemType Directory -Force -Path "dist/$version" | Out-Null
          foreach ($idioma in @("es", "en", "pt")) {
            $sufijo = if ($idioma -eq "es") { "" } else { "-$idioma" }
            $salida = & powershell -NoProfile -ExecutionPolicy Bypass -File build/msi.ps1 -Exe $exe -Version $version -Idioma $idioma -Out "dist/$version/guardiana-$version-windows-x64$sufijo.msi" 2>&1 | Out-String
            Write-Output $salida
            if ($LASTEXITCODE -ne 0) {
              # Annotations show on the run page without signing in; the log does not. Whoever
              # reads why it failed may not have a GitHub session on that machine.
              $corto = ($salida -replace "`r?`n", " | ")
              if ($corto.Length -gt 1800) { $corto = $corto.Substring($corto.Length - 1800) }
              Write-Output "::error title=msi.ps1 $idioma::$corto"
              exit 1
            }
          }
          Get-ChildItem "dist/$version" -Filter *.msi | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii "dist/$version/SHA256SUMS-msi"
          Get-Content "dist/$version/SHA256SUMS-msi"
          Get-Content "dist/$version/SHA256SUMS-msi" | ForEach-Object {
            $p = $_ -split '\s+'
            Write-Output "::notice title=$($p[1])::$($p[0])"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: guardiana-instaladores
          path: |
            dist/*/*.msi
            dist/*/SHA256SUMS-msi
          retention-days: 14
