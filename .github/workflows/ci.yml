# CI: every check from CLAUDE.md, on Linux, Windows and macOS (brief §11).
# CI never holds signing keys and never publishes anything (brief §10).
# macOS joined on 4 Oct 2026: the development Mac was sold the next day, and the code behind
# cfg(target_os = "macos") -- the Mac's DNS, launchd, the DHCP lease -- was only ever compiled
# and tested on it. Now it is checked on every push, on a Mac that is not ours.
name: ci

on:
  push:
    # Every branch: a fix is checked on Linux and Windows before it reaches main, even when it
    # was pushed from somewhere that cannot open a pull request (28 Sep 2026).
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # master, not the «stable» branch: that one is force-pushed on every Rust release and a
      # SHA pinned there is orphaned (review of 9 Oct 2026). The toolchain is named instead.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: fmt
        run: cargo fmt --all --check
      - name: build
        run: cargo build --workspace --locked
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        # The tests read the Spanish texts; Windows would otherwise speak the runner's English
        # (the CLI follows the Windows account's language since 1.0.1).
        env:
          GUARDIANA_LANG: es
        # Failing tests also as annotations: they can be read from the run page and the public
        # API without signing in, the log cannot.
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee "$RUNNER_TEMP/test.log" && exit 0
          grep -E "^test .* FAILED$|panicked at|^---- " "$RUNNER_TEMP/test.log" | head -30 | while IFS= read -r l; do echo "::error title=cargo test::$l"; done
          grep -A12 "panicked at" "$RUNNER_TEMP/test.log" | head -60 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/^/::error title=detalle::/'; echo
          exit 1

  supply-chain:
    name: audit and deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-audit,cargo-deny
      - name: audit
        run: cargo audit
      - name: deny
        run: cargo deny check
