# GUARDIANA ZERO, the browser: built and tested on a clean Windows (it runs only there).
# Its brain (crates/zero) is checked by ci.yml on Linux, Windows and macOS like every crate; this
# job builds the Windows program around it, starts it for real and drives it end to end
# (zero/prueba/prueba.js), checking on a local server what left the browser and what did not.
# CI never holds signing keys and never publishes anything (brief §10).
name: zero

on:
  push:
    branches: ['**']
    paths:
      - 'zero/**'
      - 'crates/zero/**'
      - 'crates/lists/**'
      - 'crates/core/**'
      - 'crates/license/**'
      - '.github/workflows/zero.yml'
  workflow_dispatch:
    inputs:
      lock:
        description: "«actualizar» updates zero/navegador/Cargo.lock for a new dependency of crates/zero (it comes back in the artifact, to be committed)"
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: GUARDIANA ZERO (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: zero/navegador
      - name: fmt
        working-directory: zero/navegador
        run: cargo fmt --check
      # Only when asked: the browser's brain gained a dependency (9 Oct 2026: the subscription
      # brought guardiana-license). The rest of the lock stays as it was; every later step is
      # --locked against the updated file, which the artifact carries back to be committed.
      - name: update the lock
        if: ${{ github.event.inputs.lock == 'actualizar' }}
        working-directory: zero/navegador
        run: cargo update -p guardiana-zero
      - name: clippy
        working-directory: zero/navegador
        # Errors also as annotations: readable from the run page and the public API.
        run: |
          r=0
          cargo clippy --all-targets --locked --message-format=json -- -D warnings > "$RUNNER_TEMP/clippy.json" || r=$?
          node ../prueba/anotaciones.js "$RUNNER_TEMP/clippy.json" zero/navegador/
          exit $r
      - name: build
        working-directory: zero/navegador
        run: |
          r=0
          cargo build --release --locked --message-format=json > "$RUNNER_TEMP/build.json" || r=$?
          node ../prueba/anotaciones.js "$RUNNER_TEMP/build.json" zero/navegador/
          exit $r
      - name: end to end
        working-directory: zero/prueba
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm install --no-audit --no-fund --no-save playwright-core@1.47.2
          node prueba.js "$GITHUB_WORKSPACE/zero/navegador/target/release/guardiana-zero.exe" "$RUNNER_TEMP/e2e"
      # The installer (build/wix/zero.wxs): per user, no administrator, shortcuts, opens at the
      # end. Three MSIs, one per language, with WiX 5 as candidato.yml builds GUARDIANA's.
      - name: installer (WiX 5, three languages)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
          $v = (Select-String -Path zero/navegador/Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path msi | Out-Null
          $exe = (Resolve-Path zero/navegador/target/release/guardiana-zero.exe).Path
          foreach ($idioma in 'es', 'en', 'pt') {
            $sufijo = if ($idioma -eq 'es') { '' } else { "-$idioma" }
            # The output goes into the annotation on failure: the run page and the public API
            # carry the reason, not only the log (which only a signed-in browser can open).
            $salida = & powershell -NoProfile -ExecutionPolicy Bypass -File build/msi-zero.ps1 -Exe $exe -Version $v -Idioma $idioma -Out "$PWD/msi/guardiana-zero-$v-windows-x64$sufijo.msi" 2>&1 | Out-String
            Write-Output $salida
            if ($LASTEXITCODE -ne 0) {
              $corto = $salida.Substring([Math]::Max(0, $salida.Length - 3500))
              Write-Output "::error title=msi-zero.ps1 $idioma::$($corto -replace "`r?`n", ' | ')"
              exit 1
            }
          }
      # And what a person gets from it, on this clean Windows: zero/prueba/instalador.ps1.
      - name: installer end to end
        shell: pwsh
        run: |
          $v = (Select-String -Path zero/navegador/Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          powershell -NoProfile -ExecutionPolicy Bypass -File zero/prueba/instalador.ps1 -Msi "msi/guardiana-zero-$v-windows-x64.msi" -Exe zero/navegador/target/release/guardiana-zero.exe -Version $v -Otros "msi/guardiana-zero-$v-windows-x64-en.msi","msi/guardiana-zero-$v-windows-x64-pt.msi"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item -Recurse -Force "$env:RUNNER_TEMP/instalador" "$env:RUNNER_TEMP/e2e/instalador" -ErrorAction SilentlyContinue
      - name: package
        if: always()
        run: |
          mkdir -p dist
          exe=zero/navegador/target/release/guardiana-zero.exe
          # The published name carries the version, like GUARDIANA's own files.
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' zero/navegador/Cargo.toml | head -n 1)
          nombre="guardiana-zero-$v-windows-x64.exe"
          # The browser travels only when every step passed: an artifact from a red run must never
          # be the one that gets signed (review of 9 Oct 2026). The test's screenshots always do.
          if [ -f "$exe" ] && [ "${{ job.status }}" = "success" ]; then
            cp "$exe" "dist/$nombre"
            # The three installers travel with it, under the same SHA256SUMS: what gets signed
            # is exactly what was built and tested here, installer included.
            cp msi/guardiana-zero-"$v"-windows-x64*.msi dist/
            (cd dist && sha256sum "$nombre" guardiana-zero-"$v"-windows-x64*.msi > SHA256SUMS && while read -r h n; do echo "::notice title=sha256 ${n#\*}::$h"; done < SHA256SUMS)
            echo "$GITHUB_SHA" > dist/COMMIT
          elif [ -f "$exe" ]; then
            echo "::warning title=sin navegador::la ejecución no pasó entera, así que el artefacto no lleva el .exe"
          fi
          cp zero/navegador/Cargo.lock dist/ 2>/dev/null || true
          cp -r "$RUNNER_TEMP/e2e" dist/prueba 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: guardiana-zero-windows
          path: dist
          if-no-files-found: warn
